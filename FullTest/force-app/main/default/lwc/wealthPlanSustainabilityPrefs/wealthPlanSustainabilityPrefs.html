<template>
    <c-wealth-plan-view-shell
        style={dynamicBgStyle}
        dashboard-title="Sustainability Preferences"
        dashboard-subtitle="Manage and track the client's ESG requirements and engagement strategies."
        editor-title={modalTitle}
        is-editor-view={isEditorView}
        is-dirty={isDirty}
        use-modal-editor
        onshellsave={handleSaveToFlow}
        onshellcancel={handleCancelEdit}
        onshellapply={handleApplyEdit}>

        <!-- ========================================================= -->
        <!-- DASHBOARD CONTENT                                         -->
        <!-- ========================================================= -->
        <div slot="dashboard-content" class="dashboard-content-wrapper">
            
            <div class="stats-row">
                <c-wealth-plan-stat-card label="Total Preferences" value={totalRecords}></c-wealth-plan-stat-card>
                <c-wealth-plan-stat-card label="Active Configurations" value={activeRecords} variant="highlight"></c-wealth-plan-stat-card>
                
                <div class={publishCardClass} title={publishTitleText}>
                    <div class="publish-info">
                        <template if:false={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" class="draft-icon"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            <span><b>Unpublished</b></span>
                        </template>
                        <template if:true={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" class="published-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span><b>Published</b></span>
                        </template>
                    </div>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={localIsPublished} onchange={handlePublishToggle} disabled={isToggleDisabled}>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <button class="btn-create-card" onclick={handleAddNew}>
                    <div class="create-icon-wrap">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 3v18m9-9H3"></path></svg>
                    </div>
                    <b>Add Preferences</b>
                </button>
            </div>

            <!-- DASHBOARD AI ACCORDION MODULE -->
            <template if:true={showAiSection}>
                <div class="ai-accordion-panel fade-in">
                    <div class="ai-header" onclick={toggleAiPanel}>
                        <div class="ai-header-left">
                            <span class="ai-badge">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                <b>AI ANALYSIS</b>
                            </span>
                            <span class="ai-title"><b>Sustainability Overview</b></span>
                        </div>
                        <div class="ai-header-right">
                            <span class="ai-provider"><span class="blue-dot"></span> Formue Intelligence</span>
                            <svg class={chevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>

                    <div class={aiBodyClass}>
                        <template if:true={isAiLoading}>
                            <div class="ai-formue-loader">
                                <div class="loader-graphic live-network">
                                    <svg viewBox="0 0 100 100" width="120" height="120">
                                        <defs>
                                            <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                                                <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
                                                <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
                                            </radialGradient>
                                        </defs>
                                        <!-- Animated Network Elements -->
                                        <circle cx="50" cy="50" r="32" fill="none" stroke="#e0e7ff" stroke-width="0.75" class="spin-slow" stroke-dasharray="4 8" />
                                        <circle cx="50" cy="50" r="18" fill="none" stroke="#e0e7ff" stroke-width="0.5" />
                                        <g stroke="#c7d2fe" stroke-width="1.5">
                                            <line x1="50" y1="50" x2="20" y2="25" class="data-stream delay-1" />
                                            <line x1="50" y1="50" x2="80" y2="25" class="data-stream delay-2" />
                                            <line x1="50" y1="50" x2="15" y2="60" class="data-stream delay-3" />
                                            <line x1="50" y1="50" x2="85" y2="60" class="data-stream delay-4" />
                                            <line x1="50" y1="50" x2="50" y2="85" class="data-stream delay-5" />
                                            <line x1="20" y1="25" x2="80" y2="25" class="data-stream perimeter delay-3" />
                                            <line x1="80" y1="25" x2="85" y2="60" class="data-stream perimeter delay-1" />
                                            <line x1="85" y1="60" x2="50" y2="85" class="data-stream perimeter delay-4" />
                                            <line x1="50" y1="85" x2="15" y2="60" class="data-stream perimeter delay-2" />
                                            <line x1="15" y1="60" x2="20" y2="25" class="data-stream perimeter delay-5" />
                                        </g>
                                        <g class="orbit-fast" transform-origin="50px 50px"><circle cx="18" cy="50" r="2" fill="#a855f7" /></g>
                                        <g class="orbit-slow" transform-origin="50px 50px"><circle cx="76" cy="35" r="1.5" fill="#8b5cf6" /></g>
                                        <g class="orbit-reverse" transform-origin="50px 50px"><circle cx="36" cy="80" r="2" fill="#60a5fa" /></g>
                                        <g fill="#ffffff" stroke="#818cf8" stroke-width="1.5">
                                            <circle cx="20" cy="25" r="4" class="pulse-node delay-1" transform-origin="20px 25px" />
                                            <circle cx="80" cy="25" r="4" class="pulse-node delay-2" transform-origin="80px 25px" />
                                            <circle cx="15" cy="60" r="4" class="pulse-node delay-3" transform-origin="15px 60px" />
                                            <circle cx="85" cy="60" r="4" class="pulse-node delay-4" transform-origin="85px 60px" />
                                            <circle cx="50" cy="85" r="4" class="pulse-node delay-5" transform-origin="50px 85px" />
                                        </g>
                                        <!-- Core Glowing Engine -->
                                        <circle cx="50" cy="50" r="20" fill="url(#coreGlow)" class="core-glow" transform-origin="50px 50px" />
                                        <circle cx="50" cy="50" r="11" fill="#60a5fa" class="pulse-center" transform-origin="50px 50px" />
                                        <polygon points="50,43 51.5,47.5 56,47.5 52.5,50.5 54,55 50,52 46,55 47.5,50.5 44,47.5 48.5,47.5" fill="#ffffff" />
                                    </svg>
                                </div>
                                <div class="loader-brand">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                    <b>Formue Intelligence</b>
                                </div>
                                <div class="loader-status"><span class="status-dot"></span> Reading your Wealth Plan...</div>
                                <div class="loader-bar-container"><div class="loader-bar"></div></div>
                            </div>
                        </template>
                        <template if:false={isAiLoading}>
                            <div class="ai-content-rich"><lightning-formatted-rich-text value={aiInsightSummary}></lightning-formatted-rich-text></div>
                            <div class="ai-footer">Generated by Formue AI · Wealth Plan Intelligence</div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- COMPACT DATA GRID -->
            <div class="compact-table-container">
                <template if:true={hasRecords}>
                    <div class="table-header">
                        <div class="th-name">Sustainability Preferences Name</div>
                        <div class="th-date">Date</div>
                        <div class="th-prefs">Sustainability Preferences</div>
                        <div class="th-comment">Advisor Comment (Preferences)</div>
                        <div class="th-active align-center">Active</div>
                        <div class="th-lastmod">Last Modified Date</div>
                        <div class="th-actions align-center">Actions</div>
                    </div>
                    
                    <div class="table-body">
                        <template for:each={paginatedData} for:item="r">
                            <div class={r.rowClass} key={r.Id}>
                                
                                <div class="td-name">
                                    <div class="tiny-icon">
                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                                    </div>
                                    <div class="name-stack">
                                        <template if:true={r.isMarkedForDeletion}><span class="text-strikethrough"><b>{r.Name}</b></span></template>
                                        <template if:false={r.isMarkedForDeletion}><b>{r.Name}</b></template>
                                    </div>
                                </div>

                                <div class="td-date"><span class="td-sub">{r.formattedDate}</span></div>

                                <div class="td-prefs"><span class="badge-tiny badge-outline"><b>{r.SustainabilityPreferences__c}</b></span></div>

                                <div class="td-comment">
                                    <div class="scrollable-message-container">
                                        <template if:true={r.isMarkedForDeletion}>
                                            <span class="text-strikethrough scrollable-message">{r.AdvisorCommentPreferences__c}</span>
                                        </template>
                                        <template if:false={r.isMarkedForDeletion}>
                                            <div class="scrollable-message">{r.AdvisorCommentPreferences__c}</div>
                                        </template>
                                    </div>
                                </div>

                                <div class="td-active align-center">
                                    <template if:true={r.Active__c}><svg viewBox="0 0 24 24" width="18" height="18" stroke="#10b981" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg></template>
                                </div>

                                <div class="td-lastmod"><span class="td-sub">{r.formattedLastMod}</span></div>

                                <div class="td-actions align-center">
                                    <template if:false={r.isMarkedForDeletion}>
                                        <button class="btn-icon-only" onclick={handleEditRequest} data-id={r.Id} title="Edit"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                                    </template>
                                    <template if:true={r.isMarkedForDeletion}>
                                        <button class="btn-restore" onclick={handleRestore} data-id={r.Id} title="Undo Delete">
                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                                            <b>Undo</b>
                                        </button>
                                    </template>
                                </div>

                            </div>
                        </template>
                    </div>

                    <template if:true={showPagination}>
                        <div class="pagination-controls">
                            <button class="btn-page" disabled={isFirstPage} onclick={handlePrevPage}><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg><b>Previous</b></button>
                            <span class="page-info">Page <b>{currentPage}</b> of <b>{totalPages}</b></span>
                            <button class="btn-page" disabled={isLastPage} onclick={handleNextPage}><b>Next</b><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        </div>
                    </template>
                </template>
                
                <template if:false={hasRecords}>
                    <div class="empty-state">
                        <div class="icon-circle">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
                        </div>
                        <h2><b>No Sustainability Preferences Defined</b></h2>
                        <p>Track the client's ESG goals and engagement strategies.</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- EDITOR FORM                                               -->
        <!-- ========================================================= -->
        <div slot="editor-form">
            
            <div class="editor-section-header">
                <h3><b>General</b></h3>
            </div>

            <div class="form-row split-row">
                <c-wealth-plan-premium-input label="Sustainability Preferences Name" field-name="Name" value={currentRecord.Name} required="true" onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
                <c-wealth-plan-premium-input label="Date" type="date" field-name="Date__c" value={currentRecord.Date__c} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>

            <div class="editor-section-header">
                <h3><b>Sustainability Investment Preferences</b></h3>
            </div>

            <div class="form-row split-row">
                <c-wealth-plan-premium-input label="Sustainability Preferences" type="select" field-name="SustainabilityPreferences__c" options={currentPrefOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
                <c-wealth-plan-premium-input label="Engagement Strategy" type="select" field-name="EngagementStrategy__c" options={currentStratOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>
            
            <div class="form-row split-row">
                <div class="form-group-direct">
                    <div class="help-text" style="margin-bottom: 8px;">
                        <p><b>Please select a value for Sustainable Investments Share between <em>Low</em>, <em>Medium</em> or <em>High</em>.</b></p>
                        <p><b>If no value is set, then default will be set to <em>Low</em>.</b></p>
                    </div>
                    <c-wealth-plan-premium-input label="Sustainable Investments Share" type="select" field-name="SustainableInvestmentsShare__c" options={currentShareOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
                </div>
                <c-wealth-plan-premium-input label="Improve Negative Impacts" type="select" field-name="ImproveNegativeImpacts__c" options={currentImpactOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>

            <!-- DUAL LISTBOX -->
            <div class="form-row dual-listbox-wrapper">
                <lightning-dual-listbox 
                    name="SpecificThemes"
                    label="Specific Themes"
                    source-label="Available"
                    selected-label="Chosen"
                    options={editorThemeOptions}
                    value={currentRecord.themesArray}
                    onchange={handleDualListChange}>
                </lightning-dual-listbox>
            </div>

            <div class="editor-section-header">
                <h3><b>Comment</b></h3>
            </div>

            <div class="form-row expanded-textarea-row">
                <div class="form-group-direct">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label><b>Advisor Comment (Preferences)</b></label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label style="font-size: 0.9rem; color: #475569;"><b>Active</b></label>
                            <label class="premium-toggle" style="transform: scale(0.85); transform-origin: right;">
                                <input type="checkbox" checked={currentRecord.Active__c} data-field="Active__c" onchange={handleToggleChange} />
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Text Area with Insert Templates functionality -->
                    <textarea class="premium-input-direct textarea-direct" name="AdvisorCommentPreferences__c" oninput={handleDirectTextareaChange} placeholder="Enter comments here..."></textarea>
                    
                    <div class="template-action-row">
                        <template if:true={hasEnglishTemplate}>
                            <button class="btn-template" onclick={insertEnglishTemplate}>EN</button>
                        </template>
                        <template if:true={hasLocalTemplate}>
                            <button class="btn-template" onclick={insertLocalTemplate}>{localLanguageCode}</button>
                        </template>
                    </div>
                </div>
            </div>

            <template if:false={isNewRecord}>
                <div class="form-row delete-action-row">
                    <button class="btn-delete-goal" onclick={handleDeleteClick}>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <b>Delete Configuration</b>
                    </button>
                </div>
            </template>
        </div>

    </c-wealth-plan-view-shell>
</template>
