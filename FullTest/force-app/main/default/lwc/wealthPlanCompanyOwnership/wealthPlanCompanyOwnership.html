<template>
    <c-wealth-plan-view-shell
        style={dynamicBgStyle}
        dashboard-title="Company Ownership"
        dashboard-subtitle="Manage equity stakes and beneficial ownership structures."
        editor-title={modalTitle}
        is-editor-view={isEditorView}
        is-dirty={isDirty}
        use-modal-editor
        onshellsave={handleSaveToFlow}
        onshellcancel={handleCancelEdit}
        onshellapply={handleApplyEdit}>

        <div slot="header-widget" class={themePillWrapClass}>
            <button class={classicSegmentClass} onclick={handleSetClassic}>
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
                <b>Classic</b>
            </button>
            <button class={corporateSegmentClass} onclick={handleSetCorporate}>
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path></svg>
                <b>Corporate</b>
            </button>
        </div>
        <template if:true={isCorporateTheme}>
            <span slot="title-badge" class="beta-sticker">BETA</span>
        </template>

        <div slot="dashboard-content" class={dashboardWrapperClass}>
            <div class="stats-row">
                <c-wealth-plan-stat-card label="Total Ownership Records" value={totalOwnerships} variant="highlight"></c-wealth-plan-stat-card>
                
                <div class={publishCardClass} title={publishTitleText}>
                    <div class="publish-info">
                        <template if:false={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" class="draft-icon"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            <span><b>Unpublished</b></span>
                        </template>
                        <template if:true={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" class="published-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span><b>Published</b></span>
                        </template>
                    </div>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={localIsPublished} onchange={handlePublishToggle} disabled={isToggleDisabled}>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <button class="btn-create-card" onclick={handleAddNew}>
                    <div class="create-icon-wrap">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    </div>
                    <b>Add Ownership</b>
                </button>
            </div>

            <!-- AI ACCORDION MODULE -->
            <template if:true={showAiSection}>
                <div class="ai-accordion-panel fade-in">
                    <div class="ai-header" onclick={toggleAiPanel}>
                        <div class="ai-header-left">
                            <span class="ai-badge">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                <b>AI ANALYSIS</b>
                            </span>
                            <span class="ai-title"><b>Company Ownership Overview</b></span>
                        </div>
                        <div class="ai-header-right">
                            <span class="ai-provider"><span class="blue-dot"></span> Formue Intelligence</span>
                            <svg class={chevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>

                    <div class={aiBodyClass}>
                        <template if:true={isAiLoading}>
                            <div class="ai-formue-loader">
                                <div class="loader-graphic live-network">
                                    <svg viewBox="0 0 100 100" width="120" height="120">
                                        <defs><radialGradient id="coreGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>
                                        <circle cx="50" cy="50" r="32" fill="none" stroke="#e0e7ff" stroke-width="0.75" class="spin-slow" stroke-dasharray="4 8" />
                                        <circle cx="50" cy="50" r="18" fill="none" stroke="#e0e7ff" stroke-width="0.5" />
                                        <g stroke="#c7d2fe" stroke-width="1.5"><line x1="50" y1="50" x2="20" y2="25" class="data-stream delay-1" /><line x1="50" y1="50" x2="80" y2="25" class="data-stream delay-2" /><line x1="50" y1="50" x2="15" y2="60" class="data-stream delay-3" /><line x1="50" y1="50" x2="85" y2="60" class="data-stream delay-4" /><line x1="50" y1="50" x2="50" y2="85" class="data-stream delay-5" /><line x1="20" y1="25" x2="80" y2="25" class="data-stream perimeter delay-3" /><line x1="80" y1="25" x2="85" y2="60" class="data-stream perimeter delay-1" /><line x1="85" y1="60" x2="50" y2="85" class="data-stream perimeter delay-4" /><line x1="50" y1="85" x2="15" y2="60" class="data-stream perimeter delay-2" /><line x1="15" y1="60" x2="20" y2="25" class="data-stream perimeter delay-5" /></g>
                                        <g class="orbit-fast" transform-origin="50px 50px"><circle cx="18" cy="50" r="2" fill="#a855f7" /></g>
                                        <g class="orbit-slow" transform-origin="50px 50px"><circle cx="76" cy="35" r="1.5" fill="#8b5cf6" /></g>
                                        <g class="orbit-reverse" transform-origin="50px 50px"><circle cx="36" cy="80" r="2" fill="#60a5fa" /></g>
                                        <g fill="#ffffff" stroke="#818cf8" stroke-width="1.5"><circle cx="20" cy="25" r="4" class="pulse-node delay-1" transform-origin="20px 25px" /><circle cx="80" cy="25" r="4" class="pulse-node delay-2" transform-origin="80px 25px" /><circle cx="15" cy="60" r="4" class="pulse-node delay-3" transform-origin="15px 60px" /><circle cx="85" cy="60" r="4" class="pulse-node delay-4" transform-origin="85px 60px" /><circle cx="50" cy="85" r="4" class="pulse-node delay-5" transform-origin="50px 85px" /></g>
                                        <circle cx="50" cy="50" r="20" fill="url(#coreGlow)" class="core-glow" transform-origin="50px 50px" />
                                        <circle cx="50" cy="50" r="11" fill="#60a5fa" class="pulse-center" transform-origin="50px 50px" />
                                        <polygon points="50,43 51.5,47.5 56,47.5 52.5,50.5 54,55 50,52 46,55 47.5,50.5 44,47.5 48.5,47.5" fill="#ffffff" />
                                    </svg>
                                </div>
                                <div class="loader-brand"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg><b>Formue Intelligence</b></div>
                                <div class="loader-status"><span class="status-dot"></span> Analyzing Ownership Structures...</div>
                                <div class="loader-bar-container"><div class="loader-bar"></div></div>
                            </div>
                        </template>
                        <template if:false={isAiLoading}>
                            <div class="ai-content-rich"><lightning-formatted-rich-text value={aiInsightSummary}></lightning-formatted-rich-text></div>
                            <div class="ai-footer">Generated by Formue AI · Wealth Plan Intelligence</div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- COMPACT DATA GRID -->
            <div class="compact-table-container">
                <template if:true={hasOwnerships}>
                    <div class="table-header">
                        <div class="th-col">Company Owned</div>
                        <div class="th-col">Company Owner</div>
                        <div class="th-col">Percentage</div>
                        <div class="th-col align-center">Beneficial Owner</div>
                        <div class="th-col">Stock Class</div>
                        <div class="th-col">Comment</div>
                        <div class="th-actions align-center">Actions</div>
                    </div>
                    <div class="table-body">
                        <template for:each={paginatedData} for:item="o">
                            <div class={o.rowClass} key={o.Id}>
                                <div class="td-col">
                                    <template if:true={o.isMarkedForDeletion}><span class="text-strikethrough"><b>{o.CompanyOwnedName}</b></span></template>
                                    <template if:false={o.isMarkedForDeletion}><b>{o.CompanyOwnedName}</b></template>
                                </div>
                                <div class="td-col text-blue">
                                    <template if:true={o.isMarkedForDeletion}><span class="text-strikethrough">{o.CompanyOwnerName}</span></template>
                                    <template if:false={o.isMarkedForDeletion}>{o.CompanyOwnerName}</template>
                                </div>
                                <div class="td-col"><b>{o.formattedPercent}</b></div>
                                <div class="td-col align-center">
                                    <template if:true={o.Beneficial_Owner__c}><svg viewBox="0 0 24 24" width="18" height="18" stroke="#10b981" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg></template>
                                </div>
                                <div class="td-col"><span class="badge-tiny">{o.Stock_Class__c}</span></div>
                                <div class="td-col"><div class="scrollable-text">{o.Comment__c}</div></div>
                                <div class="td-actions align-center">
                                    <template if:false={o.isMarkedForDeletion}>
                                        <button class="btn-icon-only" onclick={handleEditRequest} data-id={o.Id} title="Edit"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                                    </template>
                                    <template if:true={o.isMarkedForDeletion}>
                                        <button class="btn-restore" onclick={handleRestore} data-id={o.Id}>
                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                                            <b>Undo</b>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                    <template if:true={showPagination}>
                        <div class="pagination-controls">
                            <button class="btn-page" disabled={isFirstPage} onclick={handlePrevPage}><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg><b>Previous</b></button>
                            <span class="page-info">Page <b>{currentPage}</b> of <b>{totalPages}</b></span>
                            <button class="btn-page" disabled={isLastPage} onclick={handleNextPage}><b>Next</b><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                        </div>
                    </template>
                </template>
                <template if:false={hasOwnerships}>
                    <div class="empty-state">
                        <div class="icon-circle">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        </div>
                        <h2><b>No Ownership Records</b></h2>
                        <p>Link entities and map out the corporate structure.</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- EDITOR FORM                                               -->
        <!-- ========================================================= -->
        <div slot="editor-form">
            <div class="form-row split-row">
                <c-wealth-plan-premium-input label="Company Owned" type="select" field-name="Company_Owned__c" options={currentCompanyOwnedOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
                <c-wealth-plan-premium-input label="Percentage Owned (%)" type="number" field-name="Percentage_Owned__c" value={currentOwnership.Percentage_Owned__c} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>
            
            <div class="form-row split-row">
                <c-wealth-plan-premium-input label="Company Owner" type="select" field-name="Company_Owner__c" options={currentCompanyOwnerOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
                <c-wealth-plan-premium-input label="Stock Class" type="select" field-name="Stock_Class__c" options={currentStockClassOptions} onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>

            <div class="form-row">
                <div class="form-group toggle-group" style="max-width: 300px;">
                    <label><b>Beneficial Owner</b></label>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={currentOwnership.Beneficial_Owner__c} data-field="Beneficial_Owner__c" onchange={handleToggleChange} />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-row expanded-textarea-row">
                <div class="form-group-direct">
                    <label><b>Comment</b></label>
                    <textarea class="premium-input-direct textarea-direct" name="Comment__c" oninput={handleDirectTextareaChange} placeholder="Enter any notes here..."></textarea>
                </div>
            </div>

            <template if:false={isNewRecord}>
                <div class="form-row delete-action-row">
                    <button class="btn-delete-goal" onclick={handleDeleteClick}>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <b>Delete Ownership</b>
                    </button>
                </div>
            </template>
        </div>
    </c-wealth-plan-view-shell>
</template>
