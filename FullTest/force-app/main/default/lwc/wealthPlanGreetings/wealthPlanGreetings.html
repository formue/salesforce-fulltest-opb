<template>
    <c-wealth-plan-view-shell
        style={dynamicBgStyle}
        dashboard-title="Personal Greetings"
        dashboard-subtitle="Manage personalized messages and app introductions for the client."
        editor-title={modalTitle}
        is-editor-view={isEditorView}
        is-dirty={isDirty}
        is-corporate-theme={isCorporateTheme}
        use-modal-editor
        onshellsave={handleSaveToFlow}
        onshellcancel={handleCancelEdit}
        onshellapply={handleApplyEdit}>

        <div slot="header-widget" class={themePillWrapClass}>
            <button class={classicSegmentClass} onclick={handleSetClassic} aria-label="Switch to Classic theme">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
                <b>Classic</b>
            </button>
            <button class={corporateSegmentClass} onclick={handleSetCorporate} aria-label="Switch to Corporate theme">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path></svg>
                <b>Corporate</b>
            </button>
        </div>
        <template if:true={isCorporateTheme}>
            <span slot="title-badge" class="beta-sticker">BETA</span>
        </template>

        <div slot="dashboard-content" class={dashboardWrapperClass}>
            
            <template if:true={hasActiveGreetingHighlight}>
                <div class="active-highlight-banner fade-in">
                    <div class="highlight-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </div>
                    <div class="highlight-content">
                        <span class="highlight-label">Currently Active Greeting in App</span>
                        <span class="highlight-subject">{activeGreetingSubject}</span>
                    </div>
                    <div class="highlight-date">
                        Published: {activeGreetingDate}
                    </div>
                </div>
            </template>

            <div class="stats-row">
                <c-wealth-plan-stat-card label="Total Greetings" value={totalGreetings}></c-wealth-plan-stat-card>
                <c-wealth-plan-stat-card label="Active Greetings" value={activeGreetings} variant="highlight"></c-wealth-plan-stat-card>
                <c-wealth-plan-stat-card label="Read by Client" value={readGreetings} variant="green"></c-wealth-plan-stat-card>
                
                <div class={publishCardClass} title={publishTitleText}>
                    <div class="publish-info">
                        <template if:false={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" class="draft-icon"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            <span><b>Unpublished</b></span>
                        </template>
                        <template if:true={localIsPublished}>
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" class="published-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <span><b>Published</b></span>
                        </template>
                    </div>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={localIsPublished} onchange={handlePublishToggle} disabled={isToggleDisabled} />
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <button class="btn-create-card" onclick={handleAddNew}>
                    <div class="create-icon-wrap">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <b>Add Greeting</b>
                </button>
            </div>

            <!-- ========================================================= -->
            <!-- DASHBOARD AI ACCORDION MODULE                             -->
            <!-- ========================================================= -->
            <template if:true={showAiSection}>
                <div class="ai-accordion-panel fade-in">
                    <div class="ai-header" onclick={toggleDashboardAiPanel}>
                        <div class="ai-header-left">
                            <span class="ai-badge">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                <b>AI ANALYSIS</b>
                            </span>
                            <span class="ai-title"><b>Greetings Overview</b></span>
                        </div>
                        <div class="ai-header-right">
                            <span class="ai-provider"><span class="blue-dot"></span> Formue Intelligence</span>
                            <svg class={dashboardAiChevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>

                    <div class={dashboardAiBodyClass}>
                        <template if:true={isAiLoading}>
                            <div class="ai-formue-loader">
                                <div class="loader-graphic live-network">
                                    <svg viewBox="0 0 100 100" width="120" height="120">
                                        <defs><radialGradient id="coreGlowDashboard" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>
                                        <circle cx="50" cy="50" r="32" fill="none" stroke="#e0e7ff" stroke-width="0.75" class="spin-slow" stroke-dasharray="4 8" />
                                        <circle cx="50" cy="50" r="18" fill="none" stroke="#e0e7ff" stroke-width="0.5" />
                                        <g stroke="#c7d2fe" stroke-width="1.5"><line x1="50" y1="50" x2="20" y2="25" class="data-stream delay-1" /><line x1="50" y1="50" x2="80" y2="25" class="data-stream delay-2" /><line x1="50" y1="50" x2="15" y2="60" class="data-stream delay-3" /><line x1="50" y1="50" x2="85" y2="60" class="data-stream delay-4" /><line x1="50" y1="50" x2="50" y2="85" class="data-stream delay-5" /><line x1="20" y1="25" x2="80" y2="25" class="data-stream perimeter delay-3" /><line x1="80" y1="25" x2="85" y2="60" class="data-stream perimeter delay-1" /><line x1="85" y1="60" x2="50" y2="85" class="data-stream perimeter delay-4" /><line x1="50" y1="85" x2="15" y2="60" class="data-stream perimeter delay-2" /><line x1="15" y1="60" x2="20" y2="25" class="data-stream perimeter delay-5" /></g>
                                        <g class="orbit-fast" transform-origin="50px 50px"><circle cx="18" cy="50" r="2" fill="#a855f7" /></g>
                                        <g class="orbit-slow" transform-origin="50px 50px"><circle cx="76" cy="35" r="1.5" fill="#8b5cf6" /></g>
                                        <g class="orbit-reverse" transform-origin="50px 50px"><circle cx="36" cy="80" r="2" fill="#60a5fa" /></g>
                                        <g fill="#ffffff" stroke="#818cf8" stroke-width="1.5"><circle cx="20" cy="25" r="4" class="pulse-node delay-1" transform-origin="20px 25px" /><circle cx="80" cy="25" r="4" class="pulse-node delay-2" transform-origin="80px 25px" /><circle cx="15" cy="60" r="4" class="pulse-node delay-3" transform-origin="15px 60px" /><circle cx="85" cy="60" r="4" class="pulse-node delay-4" transform-origin="85px 60px" /><circle cx="50" cy="85" r="4" class="pulse-node delay-5" transform-origin="50px 85px" /></g>
                                        <circle cx="50" cy="50" r="20" fill="url(#coreGlowDashboard)" class="core-glow" transform-origin="50px 50px" />
                                        <circle cx="50" cy="50" r="11" fill="#60a5fa" class="pulse-center" transform-origin="50px 50px" />
                                    </svg>
                                </div>
                                <div class="loader-brand"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg><b>Formue Intelligence</b></div>
                                <div class="loader-status"><span class="status-dot"></span> Analyzing Greetings...</div>
                                <div class="loader-bar-container"><div class="loader-bar"></div></div>
                            </div>
                        </template>
                        <template if:false={isAiLoading}>
                            <div class="ai-content-rich"><lightning-formatted-rich-text value={aiInsightSummary}></lightning-formatted-rich-text></div>
                            <div class="ai-footer">Generated by Formue AI · Wealth Plan Intelligence</div>
                        </template>
                    </div>
                </div>
            </template>

            <div class="compact-table-container">
                <template if:true={hasGreetings}>
                    <div class="table-header">
                        <div class="th-subject">Subject</div>
                        <div class="th-message">Message (Scroll to read)</div>
                        <div class="th-status align-center">Active</div>
                        <div class="th-read align-center">Read Status</div>
                        <div class="th-date align-right">Created Date</div>
                        <div class="th-actions align-center">Actions</div>
                    </div>
                    
                    <div class="table-body">
                        <template for:each={paginatedGreetings} for:item="greeting">
                            <div class={greeting.rowClass} key={greeting.Id}>
                                
                                <div class="td-subject">
                                    <div class="tiny-icon">
                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                    </div>
                                    <div class="name-stack">
                                        <template if:true={greeting.isMarkedForDeletion}><span class="text-strikethrough"><b>{greeting.FF_Subject__c}</b></span></template>
                                        <template if:false={greeting.isMarkedForDeletion}><b>{greeting.FF_Subject__c}</b></template>
                                    </div>
                                </div>

                                <div class="td-message">
                                    <div class="scrollable-message-container">
                                        <template if:true={greeting.isMarkedForDeletion}>
                                            <span class="text-strikethrough scrollable-message"><lightning-formatted-rich-text value={greeting.fullText}></lightning-formatted-rich-text></span>
                                        </template>
                                        <template if:false={greeting.isMarkedForDeletion}>
                                            <div class="scrollable-message"><lightning-formatted-rich-text value={greeting.fullText}></lightning-formatted-rich-text></div>
                                        </template>
                                    </div>
                                </div>

                                <div class="td-status align-center">
                                    <template if:true={greeting.FF_Active__c}>
                                        <span class="badge-tiny badge-active"><b>Yes</b></span>
                                    </template>
                                    <template if:false={greeting.FF_Active__c}>
                                        <span class="badge-tiny badge-neutral"><b>No</b></span>
                                    </template>
                                </div>

                                <div class="td-read align-center">
                                    <template if:true={greeting.FF_Read__c}>
                                        <span class="badge-tiny badge-success" title="Client has read this message"><b>Read</b></span>
                                    </template>
                                    <template if:false={greeting.FF_Read__c}>
                                        <span class="badge-tiny badge-soft">Unread</span>
                                    </template>
                                </div>

                                <div class="td-date align-right">
                                    <span class="td-sub">{greeting.formattedDate}</span>
                                </div>

                                <div class="td-actions align-center">
                                    <template if:false={greeting.isMarkedForDeletion}>
                                        <button class="btn-icon-only" onclick={handleEditRequest} data-id={greeting.Id} title="Edit Greeting">
                                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        </button>
                                    </template>
                                    <template if:true={greeting.isMarkedForDeletion}>
                                        <button class="btn-restore" onclick={handleRestoreGreeting} data-id={greeting.Id} title="Undo Delete">
                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
                                            <b>Undo</b>
                                        </button>
                                    </template>
                                </div>

                            </div>
                        </template>
                    </div>

                    <template if:true={showPagination}>
                        <div class="pagination-controls">
                            <button class="btn-page" disabled={isFirstPage} onclick={handlePrevPage}>
                                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                <b>Previous</b>
                            </button>
                            <span class="page-info">Page <b>{currentPage}</b> of <b>{totalPages}</b></span>
                            <button class="btn-page" disabled={isLastPage} onclick={handleNextPage}>
                                <b>Next</b>
                                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                    </template>

                </template>
                
                <template if:false={hasGreetings}>
                    <div class="empty-state">
                        <div class="icon-circle">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </div>
                        <h2><b>No Personal Greetings Defined</b></h2>
                        <p>Create a customized welcome message for the client's app experience.</p>
                    </div>
                </template>
            </div>
        </div>

        <div slot="editor-form">
            <div class="form-row">
                <c-wealth-plan-premium-input label="Subject (app)" field-name="FF_Subject__c" value={currentGreeting.FF_Subject__c} required="true" onvaluechange={handleFormChange}></c-wealth-plan-premium-input>
            </div>

            <div class="form-row expanded-textarea-row">
                <div class="form-group-direct">
                    <label><b>Personal Greeting (app)</b></label>
                    <div class="rich-text-wrapper">
                        <lightning-input-rich-text 
                            value={currentGreeting.FF_personalGreeting__c}
                            onchange={handleRichTextChange}
                            placeholder="Write the client's app introduction here..."
                            share-with-entity-id={recordId}>
                        </lightning-input-rich-text>
                    </div>
                </div>
            </div>

            <!-- EDITOR AI ACCORDION -->
            <div class="form-row">
                <div class="ai-accordion-panel fade-in">
                    
                    <div class="ai-header" onclick={toggleEditorAiPanel}>
                        <div class="ai-header-left">
                            <span class="ai-badge">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                                <b>AI GHOSTWRITER</b>
                            </span>
                            <span class="ai-title"><b>Generate Greeting Draft</b></span>
                        </div>
                        <div class="ai-header-right">
                            <svg class={editorAiChevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                    </div>

                    <div class={editorAiBodyClass}>
                        <template if:true={isGeneratingBackgroundAi}>
                            <div class="ai-formue-loader fade-in" style="border: none; padding: 20px;">
                                <div class="loader-graphic live-network">
                                    <svg viewBox="0 0 100 100" width="120" height="120">
                                        <defs><radialGradient id="coreGlowEditor" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>
                                        <circle cx="50" cy="50" r="32" fill="none" stroke="#e0e7ff" stroke-width="0.75" class="spin-slow" stroke-dasharray="4 8" />
                                        <circle cx="50" cy="50" r="18" fill="none" stroke="#e0e7ff" stroke-width="0.5" />
                                        <g stroke="#c7d2fe" stroke-width="1.5"><line x1="50" y1="50" x2="20" y2="25" class="data-stream delay-1" /><line x1="50" y1="50" x2="80" y2="25" class="data-stream delay-2" /><line x1="50" y1="50" x2="15" y2="60" class="data-stream delay-3" /><line x1="50" y1="50" x2="85" y2="60" class="data-stream delay-4" /><line x1="50" y1="50" x2="50" y2="85" class="data-stream delay-5" /><line x1="20" y1="25" x2="80" y2="25" class="data-stream perimeter delay-3" /><line x1="80" y1="25" x2="85" y2="60" class="data-stream perimeter delay-1" /><line x1="85" y1="60" x2="50" y2="85" class="data-stream perimeter delay-4" /><line x1="50" y1="85" x2="15" y2="60" class="data-stream perimeter delay-2" /><line x1="15" y1="60" x2="20" y2="25" class="data-stream perimeter delay-5" /></g>
                                        <g class="orbit-fast" transform-origin="50px 50px"><circle cx="18" cy="50" r="2" fill="#a855f7" /></g>
                                        <g class="orbit-slow" transform-origin="50px 50px"><circle cx="76" cy="35" r="1.5" fill="#8b5cf6" /></g>
                                        <g class="orbit-reverse" transform-origin="50px 50px"><circle cx="36" cy="80" r="2" fill="#60a5fa" /></g>
                                        <g fill="#ffffff" stroke="#818cf8" stroke-width="1.5"><circle cx="20" cy="25" r="4" class="pulse-node delay-1" transform-origin="20px 25px" /><circle cx="80" cy="25" r="4" class="pulse-node delay-2" transform-origin="80px 25px" /><circle cx="15" cy="60" r="4" class="pulse-node delay-3" transform-origin="15px 60px" /><circle cx="85" cy="60" r="4" class="pulse-node delay-4" transform-origin="85px 60px" /><circle cx="50" cy="85" r="4" class="pulse-node delay-5" transform-origin="50px 85px" /></g>
                                        <circle cx="50" cy="50" r="20" fill="url(#coreGlowEditor)" class="core-glow" transform-origin="50px 50px" />
                                        <circle cx="50" cy="50" r="11" fill="#60a5fa" class="pulse-center" transform-origin="50px 50px" />
                                    </svg>
                                </div>
                                <div class="loader-brand"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg><b>Formue Intelligence</b></div>
                                <div class="loader-status"><span class="status-dot"></span> Generating AI Draft in the background...</div>
                            </div>
                        </template>

                        <template if:false={isGeneratingBackgroundAi}>
                            <template if:true={hasAiDraft}>
                                <div class="ai-draft-content-box">
                                    <lightning-formatted-rich-text value={aiDraftGreeting}></lightning-formatted-rich-text>
                                </div>
                                
                                <div style="display: flex; gap: 12px; margin-top: 16px;">
                                    <button class={aiReplaceBtnClass} onclick={handleApplyAiDraft} title="Replace greeting with this AI draft" style="flex: 1;">
                                        <template if:false={isMagicApplied}>
                                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                                            <b>Replace Content</b>
                                        </template>
                                        <template if:true={isMagicApplied}>
                                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                            <b>Magic Applied!</b>
                                        </template>
                                    </button>

                                    <button class="btn-discard" onclick={handleManualAiTrigger} title="Regenerate AI Draft" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                                        <b>Regenerate</b>
                                    </button>
                                </div>
                            </template>
                            
                            <template if:false={hasAiDraft}>
                                <div class="ai-ghost-empty">
                                    <p>No AI draft generated yet.</p>
                                    <span style="margin-bottom: 16px;">Let Formue Intelligence write a personalized draft based on the client's data.</span>
                                    <button class="btn-stay" onclick={handleManualAiTrigger} style="display: flex; align-items: center; gap: 8px;">
                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                                        <b>Generate Draft</b>
                                    </button>
                                </div>
                            </template>
                        </template>
                    </div>
                </div>
            </div>
            
            <div class="form-row split-row">
                <div class="form-group toggle-group">
                    <label><b>Is Active?</b></label>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={currentGreeting.FF_Active__c} data-field="FF_Active__c" onchange={handleToggleChange} />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                
                <div class="form-group toggle-group">
                    <label><b>Has Client Read?</b></label>
                    <label class="premium-toggle">
                        <input type="checkbox" checked={currentGreeting.FF_Read__c} disabled={isAlwaysDisabled} title="Read status is usually updated by the app." />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <template if:false={isNewRecord}>
                <div class="form-row delete-action-row">
                    <button class="btn-delete-goal" onclick={handleDeleteClick}>
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <b>Delete Greeting</b>
                    </button>
                </div>
            </template>
        </div>

    </c-wealth-plan-view-shell>
</template>
