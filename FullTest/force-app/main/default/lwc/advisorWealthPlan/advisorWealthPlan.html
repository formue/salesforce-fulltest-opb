<template>
                    <!-- ── Two-column layout ────────────────────────────────── -->
                    <div class={wpLayoutClass}>

                        <!-- LEFT PANEL: Configuration -->
                        <div class="wph-layout-left" onclick={handleWpLeftPanelClick}>
                            <div class="wph-layout-left-header">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" style="flex-shrink:0;color:#1e3a5f"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                <span class="wph-left-panel-title">Configuration</span>
                                <template lwc:if={showWpPanelRatioToggle}>
                                    <button class={panelRatioToggleClass} onclick={handleTogglePanelRatio} title={panelRatioToggleTitle}>
                                        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>
                                    </button>
                                </template>
                            </div>
                            <button class="wph-panel-toggle-btn" onclick={handleToggleWpLeftPanel} title="Collapse panel">
                                <svg class="wph-panel-toggle-chevron" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="15 18 9 12 15 6"/></svg>
                            </button>
                            <button class={stripSummaryBtnClass} data-tab="summary" onclick={handleStripTabSwitch} title="Meeting Summary">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            </button>
                            <button class={stripWpBtnClass} data-tab="wealthplan" onclick={handleStripTabSwitch} title="Wealth Plan">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                            </button>
                            <span class="wph-left-panel-label">Config</span>
                            <div class="wph-left-tab-strip">
                                <button class={summaryLeftTabClass} data-tab="summary" onclick={handleMainTabSwitch}>
                                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                    Meeting Summary
                                </button>
                                <button class={wealthPlanLeftTabClass} data-tab="wealthplan" onclick={handleMainTabSwitch}>
                                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                    Wealth Plan
                                </button>
                            </div>

                            <div class="wph-layout-left-content">

                                <!-- Readiness strip -->
                                <div class="wph-wp-readiness-strip">
                                    <button class={readinessTextClass} data-section="notes" onclick={handleWpBadgeClick} title="Open Meeting Notes &amp; Context">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        Notes
                                    </button>
                                    <button class={readinessFileClass} data-section="doc" onclick={handleWpBadgeClick} title="Open Document Upload">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                        Document
                                    </button>
                                    <button class={readinessTaskClass} data-section="artifacts" onclick={handleWpBadgeClick} title="Open Meeting Files">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                        Meeting Files
                                    </button>
                                    <button class={readinessSummaryClass} data-section="summary" onclick={handleWpBadgeClick} title="Open Meeting Files (Summary)">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
                                        Summary
                                    </button>
                                </div>

                                <!-- Zone 1: Meeting Notes -->
                                <div class="wph-wp-section-strip wph-ms-section-first">
                                    <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" onclick={handleToggleWpNotes}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-blue" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        </div>
                                        <b>Meeting Notes &amp; Context</b>
                                        <svg class={wpNotesChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                    <div class={wpNotesZoneBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <div class="wph-tips-bar">
                                                <button class="wph-tips-toggle" onclick={handleToggleWpTips}>
                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                                    Writing tips
                                                    <svg class={wpTipsChevronClass} viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                                </button>
                                            </div>
                                            <template lwc:if={_showWpTips}>
                                                <div class="wph-tips-panel fade-in">
                                                    <ul class="wph-tips-list">
                                                        <li>Use section headers: <b>Goals:</b>, <b>Assets:</b>, <b>Income:</b>, <b>Debts:</b></li>
                                                        <li>Prefix critical items with <b>Important:</b> so the AI prioritizes them</li>
                                                        <li>Be specific with values: <em>"500 000 NOK savings at DNB"</em></li>
                                                        <li>Include client requests: <em>"Client wants to retire by 60"</em></li>
                                                        <li>List follow-ups under <b>Action Items:</b> at the end</li>
                                                    </ul>
                                                    <button class="wph-insert-template-btn" onclick={handleWpTemplate}>
                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                                        Insert template
                                                    </button>
                                                </div>
                                            </template>
                                            <textarea class="wph-textarea" oninput={handleTextChange}
                                                placeholder="Paste meeting notes, advisor observations, client requests, or any context for the AI to extract and structure into wealth plan sections...">{_freeText}</textarea>
                                        </div>
                                    </div>
                                </div>

                                <!-- Zone 2: Meeting Files / Artifacts -->
                                <div class="wph-wp-section-strip">
                                    <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" onclick={handleToggleArtifacts}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-green" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                        </div>
                                        <b>Meeting Files</b>
                                        <template lwc:if={hasWpSelection}>
                                            <span class="wph-zone-collapse-badge wph-zcb-green">{wpSelectionChips.length} selected</span>
                                            <template for:each={wpSelectionChips} for:item="headerChip">
                                                <span key={headerChip.key} class={headerChip.cls}>{headerChip.label}</span>
                                            </template>
                                        </template>
                                        <template lwc:else>
                                            <span class={artifactsBadgeClass}></span>
                                        </template>
                                        <svg class={artifactsChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                    <div class={artifactsZoneBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <template lwc:if={hasMeetingSummaryInput}>
                                                <div class="wph-artifact-section-label">Meeting Summary</div>
                                                <div class={meetingSummaryArtifactClass} onclick={handleToggleMeetingSummary}>
                                                    <div class="wph-task-check">
                                                        <template lwc:if={_includeMeetingSummary}>
                                                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="#7c3aed" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                        </template>
                                                        <template lwc:else>
                                                            <div class="wph-check-empty"></div>
                                                        </template>
                                                    </div>
                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
                                                    <span class="wph-artifact-file-title">{meetingSummaryPreview}</span>
                                                    <span class="wph-artifact-type-tag wph-artifact-type-summary">Summary</span>
                                                </div>
                                                <template lwc:if={hasArtifactFiles}><div class="wph-artifacts-divider"></div></template>
                                                <template lwc:elseif={hasTasks}><div class="wph-artifacts-divider"></div></template>
                                            </template>
                                            <template lwc:if={hasArtifactFiles}>
                                                <div class="wph-artifact-section-label">Meeting Files</div>
                                                <div class="wph-artifact-file-list">
                                                    <template for:each={artifactFiles} for:item="file">
                                                        <div key={file.id} class={file.rowClass} data-id={file.id} onclick={handleArtifactFileSelect}>
                                                            <div class="wph-task-check">
                                                                <template lwc:if={file.isSelected}>
                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="#7c3aed" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                </template>
                                                                <template lwc:else>
                                                                    <div class="wph-check-empty"></div>
                                                                </template>
                                                            </div>
                                                            <span class="wph-artifact-file-icon-wrap" style={file.iconStyle}>
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                                            </span>
                                                            <span class="wph-file-title">{file.title}</span>
                                                            <span class={file.tagClass}>{file.fileType}</span>
                                                            <button type="button" class="wph-file-preview" data-document-id={file.id} onclick={handlePreviewFile} aria-label="Preview file" title="Preview">
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                                <template lwc:if={hasTasks}><div class="wph-artifacts-divider"></div></template>
                                            </template>
                                            <template lwc:elseif={hasArtifactForEvent}>
                                                <div class="wph-no-artifact-files">
                                                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                                    No files found in this meeting's artifact record.
                                                </div>
                                                <template lwc:if={hasTasks}><div class="wph-artifacts-divider"></div></template>
                                            </template>
                                            <template lwc:if={hasTasks}>
                                                <div class="wph-artifact-section-label">To-Do's</div>
                                                <div class="wph-task-list">
                                                    <template for:each={taskItems} for:item="task">
                                                        <div key={task.id} class={task.rowClass} data-id={task.id} onclick={handleTaskToggle}>
                                                            <div class="wph-task-check">
                                                                <template lwc:if={task.isSelected}>
                                                                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="#10b981" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                </template>
                                                                <template lwc:else>
                                                                    <div class="wph-check-empty"></div>
                                                                </template>
                                                            </div>
                                                            <div class="wph-task-info">
                                                                <span class="wph-task-subject">{task.subject}</span>
                                                                <span class="wph-task-meta">{task.status}</span>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:if={noArtifactsOrTasks}>
                                                <div class="wph-no-tasks">No meeting files or to-do's available.</div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Zone 3: Document Upload -->
                                <div class="wph-wp-section-strip">
                                    <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" onclick={handleToggleDoc}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-purple" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                        </div>
                                        <b>Document Upload</b>
                                        <span class={docBadgeClass}></span>
                                        <svg class={docChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                    <div class={docZoneBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <template for:each={sharedFilesWithClasses} for:item="docFile" for:index="docIdx">
                                                <div key={docFile.documentId} class={docFile.rowClass} data-index={docIdx} onclick={handleSharedFileIncludeToggle}>
                                                    <div class="wph-task-check">
                                                        <template lwc:if={docFile.included}>
                                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="#7c3aed" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                        </template>
                                                        <template lwc:else>
                                                            <div class="wph-check-empty"></div>
                                                        </template>
                                                    </div>
                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" class="wph-artifact-file-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                                    <span class="wph-file-name">{docFile.name}</span>
                                                    <template lwc:if={canSaveToEvent}>
                                                        <template lwc:if={docFile.savedToEvent}>
                                                            <span class="wph-file-saved-badge" title="Saved to event">
                                                                <svg viewBox="0 0 24 24" width="13" height="13" stroke="#4a7c59" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                                            </span>
                                                        </template>
                                                        <template lwc:else>
                                                            <button type="button" class="wph-file-save-to-event" data-index={docIdx} onclick={handleSaveToEventClick} title="Save to event record" aria-label="Save to event">
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                                                            </button>
                                                        </template>
                                                    </template>
                                                    <button type="button" class="wph-file-preview" data-document-id={docFile.documentId} onclick={handlePreviewFile} aria-label="Preview file" title="Preview">
                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                                    </button>
                                                    <button type="button" class="wph-file-remove" data-index={docIdx} onclick={handleRemoveSharedFile} aria-label="Remove file">
                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <template lwc:if={canAddDocFile}>
                                                <div class="wph-upload-zone">
                                                    <div class="wph-drop-visual">
                                                        <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="1.5" fill="none" class="wph-drop-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                                        <span class="wph-drop-text">Drop file or click to upload</span>
                                                    </div>
                                                    <lightning-file-upload label="" name="helperFile" multiple="true" accept={acceptedFormats} record-id={recordId} onuploadfinished={handleSharedFileUpload} class="wph-upload-btn"></lightning-file-upload>
                                                    <div class="wph-adv-format-row">
                                                        <span class="wph-atype-pdf">PDF</span>
                                                        <span class="wph-atype-txt">TXT</span>
                                                        <span class="wph-atype-img">PNG/JPG</span>
                                                    </div>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <p class="wph-file-limit-notice">3 of 3 files used — remove a file to add another.</p>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <template lwc:if={isReviewStep}>
                                    <div class="wph-wp-regen-section">
                                        <button class="wph-wp-regen-btn" onclick={handleGenerate} aria-label="Regenerate Wealth Plan">
                                            <span class="wph-zone-icon wph-zone-icon--sm wph-icon-amber" style="width:22px;height:22px;border-radius:6px;flex-shrink:0">
                                                <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                                            </span>
                                            Regenerate Wealth Plan
                                        </button>
                                    </div>
                                </template>
                            </div><!-- end wph-layout-left-content -->
                        </div><!-- end wph-layout-left -->

                        <!-- RIGHT PANEL: Preview / placeholder / loading -->
                        <div class="wph-layout-right">
                            <template lwc:if={_wpGenerating}>
                                <div class="wph-preloaded-summary-card">
                                    <div class="wph-summary-gen-loading">
                                        <div class="wph-orb-wrap">
                                            <div class="wph-orb-core"></div>
                                            <div class="wph-orb-ring wph-ring-1"></div>
                                            <div class="wph-orb-ring wph-ring-2"></div>
                                        </div>
                                        <div class="wph-loading-header" style="width:100%;max-width:300px;margin:0">
                                            <span class="wph-loading-title"><b>{_loadingMessage}</b></span>
                                            <span class="wph-loading-pct"><b>{formattedProgress}</b></span>
                                        </div>
                                        <div class="wph-progress-track" style="width:100%;max-width:300px">
                                            <div class="wph-progress-fill" style={progressBarStyle}></div>
                                        </div>
                                        <button class="wph-cancel-gen-btn" onclick={handleCancelGeneration} aria-label="Cancel">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <template lwc:elseif={isReviewStep}>
                                <!-- Customer context header -->
                                <template lwc:if={inputPrimaryMember}>
                                    <div class="wph-section-customer-ctx">
                                        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                        <span>Wealth Plan — {inputPrimaryMember.Name}</span>
                                    </div>
                                </template>
                                <!-- Draft preservation banner -->
                                <template lwc:if={hasSavedDraft}>
                                    <template lwc:if={_modeExistingOnly}>
                                        <div class="wph-draft-banner">
                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path></svg>
                                            <span>You have an unsaved Wealth Plan draft</span>
                                            <button class="wph-draft-restore-btn" data-tab="wealthplan" onclick={handleMainTabSwitch}>View Draft</button>
                                            <button class="wph-draft-dismiss-btn" onclick={handleDismissDraft}>Dismiss</button>
                                        </div>
                                    </template>
                                </template>

                                <!-- Stats bar -->
                                <div class="wph-review-stats-bar">
                                    <div class="wph-review-stats">
                                        <span class="wph-stat-chip"><b>{sectionsWithData}</b> sections</span>
                                        <span class="wph-stat-chip"><b>{totalRecordCount}</b> suggestions</span>
                                        <template lwc:if={isDetailedStatsOn}>
                                            <span class="wph-stat-chip wph-stat-green"><b>{lockedRecordCount}</b> locked</span>
                                            <template lwc:if={hasErrors}>
                                                <span class="wph-stat-chip wph-stat-red"><b>{totalErrors}</b> errors</span>
                                            </template>
                                        </template>
                                    </div>
                                    <template lwc:if={hasExistingData}>
                                        <button class="wph-existing-btn" onclick={handleToggleExistingData} aria-label="Toggle existing data">
                                            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                                            <b>{existingDataLabel}</b>
                                        </button>
                                    </template>
                                </div>

                                <!-- Meeting Summary tab (top, collapsible) -->
                                <template lwc:if={hasMeetingSummary}>
                                    <div class={summaryTabClass}>
                                        <div class="wph-summary-tab-header-row">
                                            <button class="wph-summary-tab-header" onclick={handleToggleSummaryTab} aria-label="Toggle meeting summary">
                                                <div class="wph-summary-tab-left">
                                                    <div class="wph-summary-tab-icon">
                                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                                                    </div>
                                                    <span class="wph-summary-tab-title"><b>Meeting Summary</b></span>
                                                </div>
                                                <svg class={summaryChevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                            </button>
                                            <button class="wph-summary-edit-btn" onclick={handleToggleSummaryEdit} aria-label="Edit summary">
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                <b>{summaryEditBtnLabel}</b>
                                            </button>
                                            <template lwc:if={isSummaryEdited}>
                                                <span class="wph-summary-edited-badge">Edited</span>
                                            </template>
                                            <button class={summaryCopyClass} onclick={handleCopySummary} aria-label="Copy summary">
                                                <template lwc:if={_summaryCopied}>
                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                </template>
                                                <template lwc:else>
                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                                </template>
                                                <b>{summaryCopyLabel}</b>
                                            </button>
                                        </div>
                                        <div class="wph-summary-tab-body">
                                            <template lwc:if={_isSummaryEditing}>
                                                <textarea class="wph-summary-textarea" oninput={handleSummaryInput}>{_meetingSummaryResult}</textarea>
                                            </template>
                                            <template lwc:else>
                                                <lightning-formatted-rich-text value={_meetingSummaryResult}></lightning-formatted-rich-text>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Wealth Plan content -->
                                <template lwc:if={isWealthPlanEnabled}>
                                <div class="wph-wp-review-wrap">

                                <!-- Compact save notice banner (shown after subflow save, dismissible) -->
                                <template lwc:if={wpSaveNoticeVisible}>
                                    <div class="wph-wp-save-notice fade-in">
                                        <svg class="wph-wsn-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
                                            <circle cx="12" cy="12" r="10"/>
                                            <polyline points="9 12 11.5 14.5 15.5 10"/>
                                        </svg>
                                        <div class="wph-wsn-body">
                                            <b>Saved to Wealth Plan</b>
                                            <span>{_wpSaveNotice.totalNew} created · {_wpSaveNotice.totalUpdated} updated · {_wpSaveNotice.totalDeleted} deleted</span>
                                        </div>
                                        <button class="wph-wsn-close" onclick={handleWpNoticeDismiss} title="Dismiss">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                        </button>
                                    </div>
                                </template>
                                <!-- sections always visible so user can do multiple save actions -->

                                <!-- Validation dashboard -->
                                <div class="wph-val-dashboard fade-in">
                                    <div class="wph-val-ring-area">
                                        <svg class="wph-val-ring" viewBox="0 0 48 48">
                                            <circle cx="24" cy="24" r="20" fill="none" stroke="#f1f5f9" stroke-width="4"/>
                                            <circle cx="24" cy="24" r="20" fill="none" stroke-width="4"
                                                stroke-dasharray={validationDashArray} stroke-dashoffset="31.4"
                                                stroke-linecap="round" class={validationRingClass}
                                                transform="rotate(-90 24 24)"/>
                                        </svg>
                                        <span class="wph-val-ring-pct"><b>{validationProgressPct}</b></span>
                                    </div>
                                    <div class="wph-val-info">
                                        <span class="wph-val-title"><b>{validationLabel}</b></span>
                                        <div class="wph-val-track">
                                            <div class={validationBarClass} style={validationBarStyle}></div>
                                        </div>
                                        <div class="wph-val-chips">
                                            <span class="wph-val-chip wph-vc-total">{totalRecordCount} suggestions</span>
                                            <span class="wph-val-chip wph-vc-ok">{lockedRecordCount} accepted</span>
                                            <template lwc:if={hasErrors}>
                                                <span class="wph-val-chip wph-vc-err" onclick={handleScrollToError}>{totalErrors} errors</span>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Meeting Summary -->
                                <template lwc:if={hasSummary}>
                                    <div class="wph-summary-card fade-in">
                                        <div class="wph-summary-header">
                                            <h2 class="wph-section-title"><b>Meeting Summary</b></h2>
                                        </div>
                                        <div class="wph-summary-body">
                                            <lightning-formatted-rich-text value={_summary}></lightning-formatted-rich-text>
                                        </div>
                                    </div>
                                </template>

                                <!-- Editable Sections -->
                                <template lwc:if={hasEmptySections}>
                                    <div class="wph-empty-toggle-bar">
                                        <button class="wph-empty-toggle-btn" onclick={handleToggleEmptySections}>
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                            {emptySectionToggleLabel}
                                        </button>
                                    </div>
                                </template>
                                <template for:each={filteredReviewSections} for:item="sec">
                                    <div key={sec.key} class={sec.sectionLockClass} style={sec.animDelay}>
                                        <div class="wph-section-header" data-key={sec.key} onclick={handleToggleSection}>
                                            <div class="wph-section-header-left">
                                                <h3 class="wph-section-title"><b>{sec.label}</b></h3>
                                                <span class={sec.badgeClass}>{sec.badgeText}</span>
                                                <template lwc:if={sec.sectionHasErrors}>
                                                    <span class="wph-section-err-badge">{sec.sectionErrorCount} errors</span>
                                                </template>
                                                <template lwc:if={sec.isSectionLocked}>
                                                    <span class="wph-locked-badge">
                                                        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                                        Locked
                                                    </span>
                                                </template>
                                                <template lwc:if={sec.hasRecords}>
                                                    <div class="wph-sec-progress">
                                                        <div class="wph-sec-progress-track">
                                                            <div class="wph-sec-progress-fill" style={sec.progressStyle}></div>
                                                        </div>
                                                        <span class="wph-sec-progress-label">{sec.progressLabel}</span>
                                                    </div>
                                                </template>
                                            </div>
                                            <div class="wph-section-header-right">
                                                <template lwc:if={sec.isSectionLocked}>
                                                    <button class="wph-unlock-btn" data-key={sec.key} onclick={handleUnlockSection} aria-label="Unlock section">
                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                                                        Unlock
                                                    </button>
                                                </template>
                                                <template lwc:else>
                                                    <template lwc:if={sec.hasLockableRows}>
                                                        <button class="wph-bulk-lock-btn" data-key={sec.key} onclick={handleBulkLockSection} aria-label="Accept all valid suggestions">
                                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                            Accept all suggestions
                                                        </button>
                                                    </template>
                                                    <template lwc:if={sec.canLockSection}>
                                                        <button class="wph-lock-section-btn" data-key={sec.key} onclick={handleLockSection} aria-label="Accept section">
                                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                            Accept section
                                                        </button>
                                                    </template>
                                                    <template lwc:if={isRegenerateSectionOn}>
                                                        <button class="wph-regen-btn" data-key={sec.key} onclick={handleRegenerateSection} aria-label="Regenerate section">
                                                            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8a5 5 0 1 1 1.2 3.2"></path><path d="M3 11.5V8h3.5"></path></svg>
                                                        </button>
                                                    </template>
                                                    <template lwc:if={isDiscardSectionOn}>
                                                        <button class="wph-discard-btn" data-key={sec.key} onclick={handleDiscardSection} aria-label="Delete all in section">
                                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                            Delete all
                                                        </button>
                                                    </template>
                                                    <button class="wph-add-row-btn" data-key={sec.key} onclick={handleAddRow} aria-label="Add record">
                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                                        Add
                                                    </button>
                                                </template>
                                                <svg class={sec.chevronClass} viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                            </div>
                                        </div>
                                        <template lwc:if={sec.isExpanded}>
                                            <div class="wph-section-body">
                                                <template lwc:if={sec.hasRecords}>
                                                    <template for:each={sec.displayRecords} for:item="rec">
                                                        <div key={rec._id} class={rec._rowClass} data-row-id={rec._id} tabindex="0">
                                                            <template lwc:if={rec._isEditing}>
                                                                <div class="wph-edit-wrapper">
                                                                    <div class="wph-edit-header">
                                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                                        <span><b>Editing Record</b></span>
                                                                    </div>
                                                                    <div class="wph-edit-form">
                                                                        <div class="wph-edit-grid">
                                                                            <template for:each={rec._displayFields} for:item="fld">
                                                                                <div key={fld.api} class="wph-edit-field">
                                                                                    <label class="wph-field-label">
                                                                                        {fld.label}
                                                                                        <template lwc:if={fld.required}>
                                                                                            <span class="wph-required-mark">*</span>
                                                                                        </template>
                                                                                        <template lwc:if={fld.invalidMsg}>
                                                                                            <span class="wph-invalid-tag">{fld.invalidMsg}</span>
                                                                                        </template>
                                                                                    </label>
                                                                                    <template lwc:if={fld.isSelect}>
                                                                                        <select class={fld.selectClass} data-field={fld.api} onchange={handleFieldChange}>
                                                                                            <template for:each={fld.selectOptions} for:item="opt">
                                                                                                <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                                                                            </template>
                                                                                        </select>
                                                                                    </template>
                                                                                    <template lwc:elseif={fld.isCheckbox}>
                                                                                        <label class="wph-toggle-wrap">
                                                                                            <input type="checkbox" checked={fld.checkboxValue} data-field={fld.api} onchange={handleFieldChange}/>
                                                                                            <span class="wph-toggle-slider"></span>
                                                                                        </label>
                                                                                    </template>
                                                                                    <template lwc:elseif={fld.isTextarea}>
                                                                                        <textarea class="wph-field-input wph-field-textarea" data-field={fld.api} maxlength={fld.maxlength} oninput={handleFieldChange}>{fld.value}</textarea>
                                                                                        <template lwc:if={fld.maxlength}>
                                                                                            <div class="wph-char-counter">{fld.currentLength} / {fld.maxlength}</div>
                                                                                        </template>
                                                                                    </template>
                                                                                    <template lwc:elseif={fld.isNumber}>
                                                                                        <input type="number" class="wph-field-input" value={fld.value} data-field={fld.api} oninput={handleFieldChange}/>
                                                                                    </template>
                                                                                    <template lwc:else>
                                                                                        <input type="text" class="wph-field-input" value={fld.value} data-field={fld.api} maxlength={fld.maxlength} oninput={handleFieldChange}/>
                                                                                        <template lwc:if={fld.maxlength}>
                                                                                            <div class="wph-char-counter">{fld.currentLength} / {fld.maxlength}</div>
                                                                                        </template>
                                                                                    </template>
                                                                                </div>
                                                                            </template>
                                                                        </div>
                                                                        <div class="wph-edit-actions">
                                                                            <button class="wph-btn-done" onclick={handleSaveRow} aria-label="Done editing">
                                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                                <b>Done</b>
                                                                            </button>
                                                                            <button class="wph-btn-cancel" onclick={handleCancelEdit} aria-label="Cancel editing">Cancel</button>
                                                                        </div>
                                                                        <template lwc:if={_ownerPropagationPrompt}>
                                                                            <div class="wph-owner-prop-bar">
                                                                                <span class="wph-owner-prop-icon">
                                                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" y1="9" x2="6" y2="21"></line></svg>
                                                                                </span>
                                                                                <span class="wph-owner-prop-msg">{ownerPropagationMessage}</span>
                                                                                <button class="wph-owner-prop-apply" onclick={handleApplyOwnerPropagation}>Apply to all</button>
                                                                                <button class="wph-owner-prop-dismiss" onclick={handleDismissOwnerPropagation}>No</button>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                            <template lwc:else>
                                                                <div class="wph-record-view">
                                                                    <div class="wph-state-icon-col">
                                                                        <template lwc:if={rec._stateIsCompleted}>
                                                                            <span class="wph-state-icon wph-si-green" title={rec._stateIconTitle}>
                                                                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                            </span>
                                                                        </template>
                                                                        <template lwc:elseif={rec._stateIsDeleted}>
                                                                            <span class="wph-state-icon wph-si-red" title={rec._stateIconTitle}>
                                                                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                                            </span>
                                                                        </template>
                                                                        <template lwc:elseif={rec._stateIsLocked}>
                                                                            <span class="wph-state-icon wph-si-green" title={rec._stateIconTitle}>
                                                                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                                                            </span>
                                                                        </template>
                                                                        <template lwc:elseif={rec._stateIsError}>
                                                                            <span class="wph-state-icon wph-si-red" title={rec._stateIconTitle}>
                                                                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                                                                            </span>
                                                                        </template>
                                                                        <template lwc:elseif={rec._stateIsEdited}>
                                                                            <span class="wph-state-icon wph-si-amber" title={rec._stateIconTitle}>
                                                                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                                            </span>
                                                                        </template>
                                                                    </div>
                                                                    <div class="wph-record-content">
                                                                        <div class="wph-row-title-line">
                                                                            <span class={rec._titleClass}>{rec._titleText}</span>
                                                                            <span class={rec._sourceClass}>{rec._sourceLabel}</span>
                                                                            <template lwc:if={rec._hasSubtitle}>
                                                                                <span class="wph-row-subtitle">{rec._subtitleText}</span>
                                                                            </template>
                                                                        </div>
                                                                        <template lwc:if={rec._hasDesc}>
                                                                            <p class="wph-row-desc">{rec._descText}</p>
                                                                            <template lwc:if={rec._descMaxLength}>
                                                                                <div class="wph-char-counter wph-char-counter-view">{rec._descCharCount} / {rec._descMaxLength} characters</div>
                                                                            </template>
                                                                        </template>
                                                                        <template lwc:if={rec._hasMeta}>
                                                                            <div class="wph-row-meta">
                                                                                <template for:each={rec._metaChips} for:item="m">
                                                                                    <span key={m.api} class={m.chipClass}>
                                                                                        <span class="wph-mc-label">{m.label}:</span>
                                                                                        <span class="wph-mc-value">{m.chipDisplayValue}</span>
                                                                                    </span>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                    <div class="wph-record-actions">
                                                                        <template lwc:if={rec._completed}>
                                                                            <span class="wph-completed-badge">
                                                                                <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                                Added to Wealth Plan
                                                                            </span>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <template lwc:if={rec._isDuplicate}>
                                                                                <span class="wph-source-badge wph-src-duplicate" title={rec._duplicateMatchTitle}>Duplicate?</span>
                                                                            </template>
                                                                            <template lwc:if={rec._canShowDiff}>
                                                                                <button class="wph-diff-toggle" data-id={rec._id} onclick={handleToggleDiffView} aria-label="Toggle diff view">{rec._diffToggleLabel}</button>
                                                                            </template>
                                                                            <template lwc:if={rec._isMarkedForDeletion}>
                                                                                <button class="wph-undo-delete-btn" data-id={rec._id} data-section={rec._sectionKey} onclick={handleUndoDeletion} aria-label="Undo deletion">
                                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                                                                                    Undo
                                                                                </button>
                                                                            </template>
                                                                            <template lwc:elseif={rec._isLocked}>
                                                                                <button class="wph-unlock-btn" data-id={rec._id} data-section={rec._sectionKey} onclick={handleUnlockRow} aria-label="Unlock record" title="Unlock record">
                                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                                                                                    Unlock
                                                                                </button>
                                                                            </template>
                                                                            <template lwc:else>
                                                                                <template lwc:if={rec._canLock}>
                                                                                    <button class="wph-lock-row-btn" data-id={rec._id} data-section={rec._sectionKey} onclick={handleLockRow} aria-label="Accept record" title="Accept — confirms this suggestion for saving">
                                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                                        Accept
                                                                                    </button>
                                                                                </template>
                                                                                <button class="wph-btn-edit" data-id={rec._id} data-section={rec._sectionKey} onclick={handleEditRow} aria-label="Edit record" title="Edit record">
                                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                                                    Edit
                                                                                </button>
                                                                                <template lwc:if={rec._isExisting}>
                                                                                    <button class="wph-btn-mark-delete" data-id={rec._id} data-section={rec._sectionKey} onclick={handleMarkForDeletion} aria-label="Mark for deletion" title="Mark for deletion">
                                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                                                        Delete
                                                                                    </button>
                                                                                </template>
                                                                                <template lwc:else>
                                                                                    <button class="wph-btn-delete" data-id={rec._id} data-section={rec._sectionKey} onclick={handleRemoveRow} aria-label="Remove record" title="Remove record">
                                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                                                        Delete
                                                                                    </button>
                                                                                </template>
                                                                            </template>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                            <template lwc:if={rec._showDiff}>
                                                                <div class="wph-diff-panel fade-in">
                                                                    <template for:each={rec._diffFields} for:item="df">
                                                                        <div key={df.api} class="wph-diff-row">
                                                                            <span class="wph-diff-label">{df.label}</span>
                                                                            <span class="wph-diff-old">{df.oldValue}</span>
                                                                            <span class="wph-diff-arrow">&rarr;</span>
                                                                            <span class="wph-diff-new">{df.newValue}</span>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <div class="wph-empty-section">
                                                        <span>No suggestions for this section.</span>
                                                        <button class="wph-add-inline" data-key={sec.key} onclick={handleAddRow}>+ Add manually</button>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Floating save bar -->
                                <template lwc:if={showWpSaveBar}>
                                    <div class="wph-summary-save-bar">
                                        <template lwc:if={hasTodosToSave}>
                                            <button class="wph-save-review-btn" onclick={handleSaveTodosOnly}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                                <b>Save To-dos</b>
                                            </button>
                                        </template>
                                    </div>
                                </template>


                                </div><!-- /wph-wp-review-wrap -->
                                </template><!-- end isWealthPlanEnabled -->
                            </template>
                            <template lwc:else>
                                <div class="wph-preloaded-summary-card">
                                    <div class="wph-no-summary-placeholder">
                                        <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="1" fill="none">
                                            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                                        </svg>
                                        <b>No wealth plan yet</b>
                                        <span>Add context and generate a wealth plan with AI.</span>
                                    </div>
                                </div>
                            </template>
                        </div>

                    </div><!-- end wph-summary-layout -->

                    <!-- ── Full-width action button ──────────────────────── -->
                    <div class="wph-action-bar-full">
                        <template lwc:if={_uploadFeedback}>
                            <div class="wph-upload-feedback">
                                <div class="wph-upload-feedback-icon">
                                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <div class="wph-upload-feedback-text">
                                    <div class="wph-upload-feedback-name">{_uploadFeedback.latestName}</div>
                                    <div class="wph-upload-feedback-sub">Available in Meeting Summary &amp; Wealth Plan</div>
                                </div>
                                <span class="wph-upload-feedback-count">{_uploadFeedback.totalFiles} file(s) ready</span>
                            </div>
                        </template>
                        <template lwc:if={isReviewStep}>
                            <button class="wph-action-bar-btn wph-action-bar-btn--save" disabled={isWpSaveDisabled} onclick={handlePreviewSave} aria-label="Save to Wealth Plan">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                                <template lwc:if={isWpSaving}><b>Saving…</b></template>
                                <template lwc:else><b>Save to Wealth Plan</b></template>
                            </button>
                        </template>
                        <template lwc:else>
                            <button class="wph-action-bar-btn wph-action-bar-btn--generate" disabled={isGenerateDisabled} onclick={handleGenerate} aria-label="Generate Wealth Plan">
                                <svg class="wph-sparkle" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                <b>Generate Wealth Plan</b>
                            </button>
                        </template>
                    </div>
</template>
