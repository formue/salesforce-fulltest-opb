<template>
    <!--
      ═══════════════════════════════════════════════════════════════════════════
      ADVISOR MEETING SUMMARY — private child of advisorAssistant
      ═══════════════════════════════════════════════════════════════════════════

      No page chrome: no header, no event picker, no guide, no tour, no wealth-plan
      tab. The parent owns all of that. This template is a two-column body only.

      REGION MAP
        LEFT   Configuration panel   lwc:if={showInternalLeftPanel}
               ONLY renders standalone. In the parent, `embedded-layout` is set, so
               showInternalLeftPanel is false and the parent's own Configuration
               column supplies these inputs through @api setters instead.
               Contains: readiness pills · To-Do's switch · 5 accordions
               (Meeting Category radios · Notes & Context · Meeting Files ·
                Document Upload · Regeneration Instructions).

        RIGHT  Summary | To-Do's segment bar (hidden when embedded — the parent's
               tab bar already makes that choice), version history list, then the
               main content, which is a FOUR-WAY branch on note state:
                 1. no event selected        → prompt to pick one
                 2. published                → read-only rich text + published notice
                 3. previewing a version     → read-only + "viewing history" banner
                 4. unpublished draft        → the full editor, brief section and
                                               selection→task popup
               plus a "no summary yet" state with an inline Generate button,
               the save bar (hidden when embedded), and the To-Do's list.

        MODALS summary edit · brief edit · publish confirm · delete confirm ·
               generate-overwrite confirm.

      TWO INSTANCES: the parent mounts this component twice (data-role="summary"
      and data-role="todos"). `activeMsSection` selects which half each one shows.

      All classes are `wph-*` (inherited namespace) apart from the `aa-radio-*`
      block on the meeting-category radios.
    -->
                    <div class={summaryLayoutClass}>

                        <!-- ── LEFT PANEL: Configuration ────────────────────────
                             Standalone mode only — see the region map above. -->
                        <template lwc:if={showInternalLeftPanel}>
                        <div class="wph-layout-left" onclick={handleLeftPanelClick}>
                            <div class="wph-layout-left-header">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" style="flex-shrink:0;color:#7a8fa6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                <span class="wph-left-panel-title">Configuration</span>
                                <template lwc:if={showPanelRatioToggle}>
                                    <button class={panelRatioToggleClass} onclick={handleTogglePanelRatio} title={panelRatioToggleTitle}>
                                        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"/><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>
                                    </button>
                                </template>
                            </div>
                            <button class="wph-panel-toggle-btn" onclick={handleToggleLeftPanel} title="Collapse panel">
                                <svg class="wph-panel-toggle-chevron" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="15 18 9 12 15 6"/></svg>
                            </button>

                            <div class="wph-layout-left-content">

                                <!-- MS readiness pills — order matches accordion sequence -->
                                <div class="wph-wp-readiness-strip">
                                    <button class={msBadgeCategoryClass} data-section="category" onclick={handleMsBadgeClick} title="Open Meeting Category">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                                        Category
                                    </button>
                                    <button class={msBadgeNotesClass} data-section="notes" onclick={handleMsBadgeClick} title="Open Meeting Notes &amp; Context">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        Notes
                                    </button>
                                    <button class={msBadgeFilesClass} data-section="files" onclick={handleMsBadgeClick} title="Open Meeting Files">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                        Meeting Files
                                    </button>
                                    <button class={msBadgeDocClass} data-section="doc" onclick={handleMsBadgeClick} title="Open Document Upload">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                        Document
                                    </button>
                                    <template lwc:if={canShowRegenPill}>
                                        <button class={msBadgeRegenClass} data-section="regen" onclick={handleMsBadgeClick} title="Open Regeneration Instructions">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                            Regen
                                        </button>
                                    </template>
                                </div>

                                <!-- Service Toggle: Action Items — styled as accordion row -->
                                <div class="wph-zone-collapse-header wph-zone-collapse-header--sm" data-tour="action-items">
                                    <div class="wph-zone-icon wph-zone-icon--sm wph-icon-teal" style="margin:0">
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                                            <polyline points="9 11 12 14 22 4"/>
                                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                                        </svg>
                                    </div>
                                    <b>To-Do's</b>
                                    <span class="wph-toggle-label">{actionItemsToggleTitle}</span>
                                    <button class={actionItemsToggleClass}
                                            onclick={handleMeetingFormatChange}
                                            title={actionItemsToggleTitle}
                                            aria-pressed={_hasTodos}>
                                        <span class="wph-toggle-thumb"></span>
                                    </button>
                                </div>

                                <!-- Meeting Type accordion -->
                                <div class={msTypeSectionClass}>
                                    <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" data-tour="ms-category" onclick={handleToggleMsType}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-blue" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                                        </div>
                                        <b>Meeting Category</b>
                                        <svg class={msTypeChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                    </button>
                                    <div class={msTypeBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <div class="aa-radio-group">
                                                <label class="aa-radio-label">
                                                    <input type="radio" name="meetingType" value="whiteboard" checked={isWhiteboardSelected} onchange={handleMeetingTypeRadio} />
                                                    <span>Whiteboard Meeting</span>
                                                </label>
                                                <label class="aa-radio-label">
                                                    <input type="radio" name="meetingType" value="status" checked={isStatusSelected} onchange={handleMeetingTypeRadio} />
                                                    <span>Status Meeting</span>
                                                </label>
                                                <label class="aa-radio-label">
                                                    <input type="radio" name="meetingType" value="annual" checked={isAnnualSelected} onchange={handleMeetingTypeRadio} />
                                                    <span>Annual Review</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Meeting Notes & Context accordion -->
                                <div class="wph-wp-section-strip">
                                    <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" data-tour="ms-notes" onclick={handleToggleMsNotes}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-teal" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        </div>
                                        <b>Meeting Notes &amp; Context</b>
                                        <span class={msNotesBadgeClass}>{msNotesBadgeLabel}</span>
                                        <svg class={msNotesChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                    </button>
                                    <div class={msNotesBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <textarea
                                                class="wph-textarea"
                                                rows="4"
                                                placeholder="Add meeting notes, key topics or extra context for AI…"
                                                oninput={handleTextChange}>{_freeText}</textarea>
                                        </div>
                                    </div>
                                </div>

                                <!-- Meeting Files accordion -->
                                <div class="wph-wp-section-strip">
                                    <button type="button" class="wph-zone-collapse-header wph-zone-collapse-header--sm" data-tour="ms-input" onclick={handleToggleMsInput}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-green" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                        </div>
                                        <b>Meeting Files</b>
                                        <span class={msInputBadgeClass}>{msInputBadgeLabel}</span>
                                        <svg class={msInputChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                    </button>
                                    <div class={msInputBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <template lwc:if={hasArtifactFiles}>
                                                <div class="wph-no-note-artifact-list">
                                                    <template for:each={noNoteArtifactFiles} for:item="af">
                                                        <div key={af.id} class={af.rowClass} data-id={af.id} onclick={handleArtifactFileSelect}>
                                                            <div class="wph-task-check">
                                                                <template lwc:if={af.isChecked}>
                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="#7c3aed" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                </template>
                                                                <template lwc:else>
                                                                    <div class="wph-check-empty"></div>
                                                                </template>
                                                            </div>
                                                            <span class="wph-artifact-file-icon-wrap" style={af.iconStyle}>
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                                            </span>
                                                            <span class="wph-file-title">{af.title}</span>
                                                            <span class={af.tagClass}>{af.fileType}</span>
                                                            <button type="button" class="wph-file-preview" data-document-id={af.id} onclick={handlePreviewFile} aria-label="Preview file" title="Preview">
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <div class="wph-no-tasks">No meeting files available for this event.</div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Document Upload accordion -->
                                <div class="wph-wp-section-strip">
                                    <button type="button" class="wph-zone-collapse-header wph-zone-collapse-header--sm" onclick={handleToggleMsDocUpload}>
                                        <div class="wph-zone-icon wph-zone-icon--sm wph-icon-purple" style="margin:0">
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                        </div>
                                        <b>Document Upload</b>
                                        <span class={msDocUploadBadgeClass}>{msDocUploadBadgeLabel}</span>
                                        <svg class={msDocUploadChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                    </button>
                                    <div class={msDocUploadBodyClass}>
                                        <div class="wph-zone-collapse-inner">
                                            <!-- Uploaded files list -->
                                            <template for:each={sharedFilesWithClasses} for:item="file" for:index="idx">
                                                <div key={file.documentId} class={file.rowClass} data-index={idx} onclick={handleSharedFileIncludeToggle}>
                                                    <div class="wph-task-check">
                                                        <template lwc:if={file.included}>
                                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="#7c3aed" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                        </template>
                                                        <template lwc:else>
                                                            <div class="wph-check-empty"></div>
                                                        </template>
                                                    </div>
                                                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" class="wph-artifact-file-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                                    <span class="wph-file-name">{file.name}</span>
                                                    <template lwc:if={canSaveToEvent}>
                                                        <template lwc:if={file.savedToEvent}>
                                                            <span class="wph-file-saved-badge" title="Saved to event">
                                                                <svg viewBox="0 0 24 24" width="13" height="13" stroke="#4a7c59" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                                            </span>
                                                        </template>
                                                        <template lwc:else>
                                                            <button type="button" class="wph-file-save-to-event" data-index={idx} onclick={handleSaveToEventClick} title="Save to event record" aria-label="Save to event">
                                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                                                            </button>
                                                        </template>
                                                    </template>
                                                    <button type="button" class="wph-file-preview" data-document-id={file.documentId} onclick={handlePreviewFile} aria-label="Preview file" title="Preview">
                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                                    </button>
                                                    <button type="button" class="wph-file-remove" data-index={idx} onclick={handleRemoveSharedFile} aria-label="Remove file">
                                                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                                    </button>
                                                </div>
                                            </template>
                                            <!-- Upload feedback banner -->
                                            <template lwc:if={_uploadFeedback}>
                                                <div class="wph-upload-feedback">
                                                    <div class="wph-upload-feedback-icon">
                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                    </div>
                                                    <div class="wph-upload-feedback-text">
                                                        <div class="wph-upload-feedback-name">{_uploadFeedback.latestName}</div>
                                                        <div class="wph-upload-feedback-sub">Available in Meeting Summary &amp; Wealth Plan</div>
                                                    </div>
                                                    <span class="wph-upload-feedback-count">{_uploadFeedback.totalFiles} file(s) ready</span>
                                                </div>
                                            </template>
                                            <!-- File upload zone or limit notice -->
                                            <template lwc:if={noNoteCanAddFile}>
                                                <div class="wph-upload-zone">
                                                    <div class="wph-drop-visual">
                                                        <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="1.5" fill="none" class="wph-drop-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                                        <span class="wph-drop-text">Drop file or click to upload</span>
                                                    </div>
                                                    <lightning-file-upload label="" name="noNoteFileUpload" multiple="true" accept={acceptedFormats} record-id={recordId} onuploadfinished={handleSharedFileUpload} class="wph-upload-btn"></lightning-file-upload>
                                                    <div class="wph-adv-format-row">
                                                        <span class="wph-atype-pdf">PDF</span>
                                                        <span class="wph-atype-txt">TXT</span>
                                                        <span class="wph-atype-img">PNG/JPG</span>
                                                    </div>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <div class="wph-file-limit-notice">
                                                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                                    3 of 3 files used — remove a file to add another
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Regeneration Instructions accordion -->
                                <template lwc:if={isMeetingSection}>
                                    <template lwc:if={hasSummaryForEvent}>
                                        <template lwc:if={isNotePublished}>
                                            <!-- locked — no regen -->
                                        </template>
                                        <template lwc:else>
                                            <div class="wph-wp-section-strip">
                                                <button class="wph-zone-collapse-header wph-zone-collapse-header--sm" onclick={handleToggleMsRegen}>
                                                    <div class="wph-zone-icon wph-zone-icon--sm wph-icon-amber" style="margin:0">
                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                                    </div>
                                                    <b>Regeneration Instructions</b>
                                                    <svg class={msRegenChevronClass} viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                                </button>
                                                <div class={msRegenBodyClass}>
                                                    <div class="wph-zone-collapse-inner">
                                                        <textarea
                                                            class="wph-textarea wph-textarea--regen"
                                                            rows="3"
                                                            placeholder="E.g. 'Focus on the retirement discussion and add action points…'"
                                                            oninput={handleSummaryInstructionsInput}>{_summaryInstructions}</textarea>
                                                        <button class="wph-action-bar-btn wph-action-bar-btn--regen wph-ms-regen-inner-btn"
                                                                disabled={isRegenDisabled}
                                                                onclick={handleRegenerateSummary}
                                                                title="Adjust the current summary using your instructions. Does not re-read attachments.">
                                                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
                                                            <b>Regenerate</b>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                </template>

                            </div><!-- end wph-layout-left-content -->
                        </div><!-- end wph-layout-left -->
                        </template>

                        <!-- ── RIGHT PANEL: Output ────────────────────────────── -->
                        <div class="wph-layout-right">

                            <!-- Summary / Action Items segmented control -->
                            <template lwc:if={showMsSegmentBar}>
                                <div class="wph-ms-segment-bar">
                                    <button class={meetingSubtabClass} data-section="meeting" onclick={handleMsSubtabSwitch}>
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                        Summary
                                    </button>
                                    <button class={todosSubtabClass} data-section="todos" onclick={handleMsSubtabSwitch}>
                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                        To-Do's
                                        <template lwc:if={_todosGenerating}>
                                            <span class="wph-ms-segment-dot"></span>
                                        </template>
                                        <template lwc:elseif={_meetingTodos}>
                                            <template lwc:if={_meetingTodos.length}>
                                                <span class="wph-ms-segment-count">{_meetingTodos.length}</span>
                                            </template>
                                        </template>
                                    </button>
                                </div>
                            </template>

                            <!-- Meeting summary output -->
                            <template lwc:if={isMeetingSection}>
                                <div class="wph-ms-scroll-area">

                                <!-- Version history — shown whenever the selected event has versions -->
                                <template lwc:if={hasVersionHistory}>
                                    <div class="wph-version-history">
                                        <button class="wph-version-history-toggle" onclick={handleToggleVersionHistory}>
                                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
                                                <polyline points="6 9 12 15 18 9"></polyline>
                                            </svg>
                                            Version History ({_meetingNoteVersions.length})
                                        </button>
                                        <template lwc:if={_showVersionHistory}>
                                            <ul class="wph-version-list">
                                                <template for:each={sortedVersions} for:item="ver">
                                                    <li key={ver.Id} class="wph-version-item">
                                                        <span class="wph-version-name">{ver.Name}</span>
                                                        <span class="wph-version-status">{ver.Status__c}</span>
                                                        <span class="wph-version-date">{ver.DateActive__c}</span>
                                                        <button class="wph-version-view-btn"
                                                                data-id={ver.Id}
                                                                onclick={handlePreviewVersion}>View</button>
                                                    </li>
                                                </template>
                                            </ul>
                                        </template>
                                    </div>
                                </template>

                                <div class="wph-preloaded-summary-card">

                                    <!-- No event selected yet -->
                                    <template lwc:if={noEventSelected}>
                                        <div class="wph-no-event-notice">
                                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                            Select a meeting event above to get started.
                                        </div>
                                    </template>

                                    <!-- Event selected -->
                                    <template lwc:else>

                                        <!-- HAS a meeting summary -->
                                        <template lwc:if={hasSummaryForEvent}>

                                            <!-- Published: read-only view -->
                                            <template lwc:if={isNotePublished}>
                                                <div class="wph-summary-html-body">
                                                    <lightning-formatted-rich-text value={summaryDisplayHtml}></lightning-formatted-rich-text>
                                                </div>
                                            </template>

                                            <!-- Historical version preview: read-only view -->
                                            <template lwc:elseif={isPreviewingHistoricalVersion}>
                                                <div class="wph-summary-html-body">
                                                    <lightning-formatted-rich-text value={summaryDisplayHtml}></lightning-formatted-rich-text>
                                                </div>
                                            </template>

                                            <!-- Unpublished: full edit UI -->
                                            <template lwc:else>

                                                <!-- AI loading overlay while regenerating -->
                                                <template lwc:if={_summaryGenerating}>
                                                    <div class="wph-summary-gen-loading fade-in">
                                                        <div class="wph-sgl-orb-wrap">
                                                            <div class="wph-orb-core"></div>
                                                            <div class="wph-orb-ring wph-ring-1"></div>
                                                            <div class="wph-orb-ring wph-ring-2"></div>
                                                            <div class="wph-sgl-sparkle wph-sgl-sp1">✦</div>
                                                            <div class="wph-sgl-sparkle wph-sgl-sp2">✦</div>
                                                            <div class="wph-sgl-sparkle wph-sgl-sp3">✦</div>
                                                        </div>
                                                        <div class="wph-sgl-title">
                                                            <svg class="wph-sparkle" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                                            <b>Regenerating Meeting Summary</b>
                                                        </div>
                                                        <div class="wph-sgl-status">
                                                            <span class="wph-phase-dot"></span>
                                                            <span class="wph-sgl-message">{_summaryLoadingMessage}</span>
                                                        </div>
                                                        <div class="wph-sgl-dots">
                                                            <span class="wph-sgl-dot"></span>
                                                            <span class="wph-sgl-dot"></span>
                                                            <span class="wph-sgl-dot"></span>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- Normal edit UI -->
                                                <template lwc:else>
                                                <div class="wph-preloaded-summary-header">
                                                    <div class="wph-zone-icon wph-zone-icon--sm wph-icon-blue" style="flex-shrink:0">
                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                                    </div>
                                                    <b>Meeting Summary</b>
                                                    <template lwc:if={_currentNoteHtml}>
                                                        <span class="wph-summary-edited-badge">Edited</span>
                                                    </template>
                                                    <div class="wph-summary-actions">
                                                        <button class="wph-summary-action-btn" onclick={handleEditSummaryDirect}>
                                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                            <b>Edit Summary</b>
                                                        </button>
                                                        <template lwc:if={canRevertSummary}>
                                                            <button class="wph-summary-action-btn wph-summary-action-btn-danger" onclick={handleRevertSummary} title="Discard edits and restore the original note">
                                                                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.5"></path></svg>
                                                                <b>Revert</b>
                                                            </button>
                                                        </template>
                                                    </div>
                                                </div>

                                                    <template lwc:if={showBriefSection}>
                                                        <div class="wph-brief-section">
                                                            <button class="wph-brief-toggle" onclick={handleToggleBrief}>
                                                                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                                                <span>Brief Summary</span>
                                                                <template lwc:if={_briefGenerating}>
                                                                    <span class="wph-brief-loading-badge">
                                                                        <span class="wph-phase-dot"></span>
                                                                        Generating…
                                                                    </span>
                                                                </template>
                                                                <template lwc:else>
                                                                    <svg class={briefChevronClass} viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
                                                                </template>
                                                            </button>
                                                            <template lwc:if={_briefExpanded}>
                                                                    <div class="wph-brief-body fade-in">
                                                                        <lightning-formatted-rich-text value={briefDisplayHtml}></lightning-formatted-rich-text>
                                                                        <template lwc:if={isPreviewingHistoricalVersion}>
                                                                            <!-- no edit button when previewing a historical version -->
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <div class="wph-brief-edit-row">
                                                                                <button class="wph-summary-action-btn" onclick={handleEditBrief}>
                                                                                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                                                    <b>Edit Brief</b>
                                                                                </button>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <div class="wph-summary-selection-zone cke_editable"
                                                         tabindex="-1"
                                                         onmouseup={handleSummaryMouseUp}
                                                         onmousedown={handleSelectionZoneMouseDown}>
                                                        <div class="wph-summary-html-body">
                                                            <lightning-formatted-rich-text value={summaryDisplayHtml}></lightning-formatted-rich-text>
                                                        </div>
                                                        <template lwc:if={_selectionPopup}>
                                                            <div class="wph-convert-popup" style={selectionPopupStyle}>
                                                                <button class="wph-convert-popup-btn" onmousedown={handleConvertToTask}>
                                                                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none">
                                                                        <polyline points="9 11 12 14 22 4"/>
                                                                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                                                                    </svg>
                                                                    Add as Action Item
                                                                </button>
                                                            </div>
                                                        </template>
                                                    </div>

                                                </template><!-- end lwc:else (not generating) -->
                                            </template><!-- end lwc:else (unpublished) -->
                                        </template><!-- end hasSummaryForEvent -->

                                        <!-- No summary yet -->
                                        <template lwc:else>
                                            <template lwc:if={_summaryGenerating}>
                                                <div class="wph-summary-gen-loading fade-in">
                                                    <div class="wph-sgl-orb-wrap">
                                                        <div class="wph-orb-core"></div>
                                                        <div class="wph-orb-ring wph-ring-1"></div>
                                                        <div class="wph-orb-ring wph-ring-2"></div>
                                                        <div class="wph-sgl-sparkle wph-sgl-sp1">✦</div>
                                                        <div class="wph-sgl-sparkle wph-sgl-sp2">✦</div>
                                                        <div class="wph-sgl-sparkle wph-sgl-sp3">✦</div>
                                                    </div>
                                                    <div class="wph-sgl-title">
                                                        <svg class="wph-sparkle" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                                        <b>Generating Meeting Summary</b>
                                                    </div>
                                                    <div class="wph-sgl-status">
                                                        <span class="wph-phase-dot"></span>
                                                        <span class="wph-sgl-message">{_summaryLoadingMessage}</span>
                                                    </div>
                                                    <div class="wph-sgl-dots">
                                                        <span class="wph-sgl-dot"></span>
                                                        <span class="wph-sgl-dot"></span>
                                                        <span class="wph-sgl-dot"></span>
                                                    </div>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <div class="wph-no-summary-placeholder">
                                                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1" fill="none">
                                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                        <polyline points="14 2 14 8 20 8"></polyline>
                                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                                    </svg>
                                                    <b>No meeting summary yet</b>
                                                    <span>Select files and add context to generate one with AI.</span>
                                                </div>
                                            </template>
                                        </template><!-- end lwc:else (no summary) -->

                                    </template><!-- end lwc:else (event selected) -->
                                </div><!-- end wph-preloaded-summary-card -->
                                </div><!-- end wph-ms-scroll-area -->

                                <!-- Published notice floating bar -->
                                <template lwc:if={isNotePublished}>
                                    <div class="wph-published-notice">
                                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                        <div class="wph-published-notice-content">
                                            <div class="wph-published-notice-text">
                                                <span class="wph-published-badge">Published</span>
                                                <span>This summary is published and locked. To make changes, create a new version — the published note will remain as a record.</span>
                                            </div>
                                            <button class="wph-new-version-btn" onclick={handleCreateNewVersion}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                <b>Create New Version</b>
                                            </button>
                                        </div>
                                    </div>
                                </template>

                                <!-- Version preview floating banner -->
                                <template lwc:if={isPreviewingHistoricalVersion}>
                                    <div class="wph-version-preview-banner">
                                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        <span>Viewing <b>{previewingVersion.Name}</b> — read only</span>
                                        <button class="wph-version-exit-btn" onclick={handleExitVersionPreview}>Exit Preview</button>
                                    </div>
                                </template>

                                <!-- Save bar -->
                                <template lwc:if={showMsSaveBar}>
                                    <div class="wph-summary-save-bar">
                                        <template lwc:if={_briefGenerating}>
                                            <span class="wph-summary-saving-badge">
                                                <svg class="wph-spin" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                                                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                                </svg>
                                                Generating Brief Summary…
                                            </span>
                                        </template>
                                        <template lwc:elseif={_summarySaving}>
                                            <span class="wph-summary-saving-badge">
                                                <svg class="wph-spin" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                                                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                                                </svg>
                                                Saving…
                                            </span>
                                        </template>
                                        <template lwc:elseif={_summarySaved}>
                                            <span class="wph-summary-saved-badge">
                                                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                Saved
                                            </span>
                                        </template>
                                        <template lwc:if={canRevertSummary}>
                                            <button class="wph-save-review-btn" onclick={handleSaveSummary} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                                <b>Save &amp; Review</b>
                                            </button>
                                            <button class="wph-save-publish-btn" onclick={handleShowPublishConfirm} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                                <b>Save &amp; Publish</b>
                                            </button>
                                            <button class="wph-save-exit-btn" onclick={handleSaveAndExit} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                                    <polyline points="16 17 21 12 16 7"/>
                                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                                </svg>
                                                <b>Save &amp; Exit</b>
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <button class="wph-save-publish-btn" onclick={handleShowPublishConfirm} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                                <b>Publish</b>
                                            </button>
                                            <button class="wph-save-exit-btn" onclick={handlePublishAndExit} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                                    <polyline points="16 17 21 12 16 7"/>
                                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                                </svg>
                                                <b>Publish &amp; Exit</b>
                                            </button>
                                        </template>
                                        <template lwc:if={canDeleteNote}>
                                            <span class="wph-save-bar-divider"></span>
                                            <button class="wph-delete-note-btn" onclick={handleShowDeleteNoteConfirm} disabled={_saveBarBusy}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                                                Delete Note
                                            </button>
                                        </template>
                                    </div>
                                </template>
                            </template><!-- end isMeetingSection output -->

                            <!-- To-do's output -->
                            <template lwc:if={isTodosSection}>
                                <div class="wph-ms-scroll-area">
                                <div class="wph-preloaded-summary-card">
                                    <template lwc:if={noEventSelected}>
                                        <div class="wph-no-event-notice">
                                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                            Select a meeting event above to get started.
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <template lwc:if={_todosGenerating}>
                                            <div class="wph-summary-gen-loading fade-in">
                                                <div class="wph-sgl-orb-wrap">
                                                    <div class="wph-orb-core"></div>
                                                    <div class="wph-orb-ring wph-ring-1"></div>
                                                    <div class="wph-orb-ring wph-ring-2"></div>
                                                    <div class="wph-sgl-sparkle wph-sgl-sp1">✦</div>
                                                    <div class="wph-sgl-sparkle wph-sgl-sp2">✦</div>
                                                    <div class="wph-sgl-sparkle wph-sgl-sp3">✦</div>
                                                </div>
                                                <div class="wph-sgl-title">
                                                    <svg class="wph-sparkle" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                                    <b>Generating To-Do's</b>
                                                </div>
                                                <div class="wph-sgl-dots">
                                                    <span class="wph-sgl-dot"></span>
                                                    <span class="wph-sgl-dot"></span>
                                                    <span class="wph-sgl-dot"></span>
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:elseif={hasMeetingTodos}>
                                            <div class="wph-zone-collapse-inner wph-zone-collapse-inner--flush">
                                                <template lwc:if={todoPriorityCounts.hasAny}>
                                                    <div class="wph-priority-net-strip">
                                                        <template lwc:if={todoPriorityCounts.high}>
                                                            <span class="wph-pnet-chip wph-pnet-chip--high">{todoPriorityCounts.high} High</span>
                                                        </template>
                                                        <template lwc:if={todoPriorityCounts.normal}>
                                                            <span class="wph-pnet-chip wph-pnet-chip--normal">{todoPriorityCounts.normal} Normal</span>
                                                        </template>
                                                        <template lwc:if={todoPriorityCounts.low}>
                                                            <span class="wph-pnet-chip wph-pnet-chip--low">{todoPriorityCounts.low} Low</span>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template for:each={_meetingTodos} for:item="todo">
                                                    <div key={todo._key} class={todo._rowClass}>
                                                        <div class="wph-record-view">
                                                            <div class="wph-state-icon-col">
                                                                <template lwc:if={todo._saved}>
                                                                    <span class="wph-state-icon wph-si-teal" title="Saved to Salesforce">
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                                                    </span>
                                                                </template>
                                                                <template lwc:elseif={todo._accepted}>
                                                                    <span class="wph-state-icon wph-si-green" title="Accepted">
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                                                    </span>
                                                                </template>
                                                            </div>
                                                            <div class="wph-record-content">
                                                                <div class="wph-row-title-line">
                                                                    <span class="wph-row-title">{todo.Subject}</span>
                                                                </div>
                                                                <template lwc:if={todo.Description}>
                                                                    <p class="wph-row-desc">{todo.Description}</p>
                                                                </template>
                                                                <div class="wph-row-meta">
                                                                    <template lwc:if={todo.Priority}>
                                                                        <span class="wph-meta-chip">
                                                                            <span class="wph-mc-label">Priority:</span>
                                                                            <span class="wph-mc-value">{todo.Priority}</span>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <span class="wph-meta-chip">
                                                                            <span class="wph-mc-label">Priority:</span>
                                                                            <span class="wph-mc-value wph-mc-empty">Normal</span>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:if={todo.ActivityDate}>
                                                                        <span class="wph-meta-chip">
                                                                            <span class="wph-mc-label">Due:</span>
                                                                            <span class="wph-mc-value">{todo.ActivityDate}</span>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <span class="wph-meta-chip">
                                                                            <span class="wph-mc-label">Due:</span>
                                                                            <span class="wph-mc-value wph-mc-empty">No date</span>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:if={todo.IsPublic__c}>
                                                                        <span class="wph-meta-chip wph-meta-chip--public">
                                                                            <span class="wph-mc-value">Public</span>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <span class="wph-meta-chip">
                                                                            <span class="wph-mc-label">Visibility:</span>
                                                                            <span class="wph-mc-value wph-mc-empty">Internal</span>
                                                                        </span>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                            <div class="wph-record-actions">
                                                                <template lwc:if={todo._saved}>
                                                                    <span class="wph-saved-tag">
                                                                        <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                                                        Created
                                                                    </span>
                                                                </template>
                                                                <template lwc:elseif={todo._accepted}>
                                                                    <button class="wph-unlock-btn" data-key={todo._key} onclick={handleUndoTodo}>
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                                                                        Undo
                                                                    </button>
                                                                </template>
                                                                <template lwc:else>
                                                                    <button class="wph-btn-edit" data-key={todo._key} onclick={handleEditTodo}>
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                                        Edit
                                                                    </button>
                                                                    <button class="wph-lock-row-btn" data-key={todo._key} onclick={handleAcceptTodo}>
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                                                        Accept
                                                                    </button>
                                                                    <button class="wph-btn-mark-delete" data-key={todo._key} onclick={handleRemoveTodo}>
                                                                        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                                                        Remove
                                                                    </button>
                                                                </template>
                                                            </div>
                                                        </div>
                                                        <template lwc:if={todo._isEditing}>
                                                            <div class="wph-todo-edit-form">
                                                                <div class="wph-todo-edit-fields">
                                                                    <input class="wph-todo-edit-input" type="text" data-field="Subject" value={todo.Subject} placeholder="Subject" />
                                                                    <textarea class="wph-todo-edit-textarea" data-field="Description" placeholder="Description (optional)">{todo.Description}</textarea>
                                                                    <div class="wph-todo-edit-row">
                                                                        <select class="wph-todo-edit-select" data-field="Priority">
                                                                            <option value="" selected={todo._priorityIsBlank}>Priority…</option>
                                                                            <option value="High" selected={todo._priorityIsHigh}>High</option>
                                                                            <option value="Normal" selected={todo._priorityIsNormal}>Normal</option>
                                                                            <option value="Low" selected={todo._priorityIsLow}>Low</option>
                                                                        </select>
                                                                        <input class="wph-todo-edit-date" type="date" data-field="ActivityDate" value={todo.ActivityDate} />
                                                                    </div>
                                                                    <label class="wph-todo-edit-public">
                                                                        <input type="checkbox" data-field="IsPublic__c" checked={todo.IsPublic__c} />
                                                                        <span>Public</span>
                                                                    </label>
                                                                </div>
                                                                <div class="wph-todo-edit-actions">
                                                                    <button class="wph-summary-cancel-btn" data-key={todo._key} onclick={handleCancelEditTodo}>Cancel</button>
                                                                    <button class="wph-summary-save-btn" data-key={todo._key} onclick={handleSaveTodoEdit}>
                                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                                                        <b>Save</b>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="wph-no-summary-create">
                                                <div class="wph-no-summary-header">
                                                    <div class="wph-zone-icon wph-zone-icon--sm wph-icon-teal" style="flex-shrink:0">
                                                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                                                    </div>
                                                    <div class="wph-no-summary-text">
                                                        <b>No to-do's yet</b>
                                                        <span>Generate to-do's from the meeting summary with AI.</span>
                                                    </div>
                                                </div>
                                                <div class="wph-generate-bar">
                                                    <button class="wph-generate-btn" onclick={handleGenerateTodosDirect}>
                                                        <svg class="wph-sparkle" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                                                        <b>Generate To-do's</b>
                                                    </button>
                                                </div>
