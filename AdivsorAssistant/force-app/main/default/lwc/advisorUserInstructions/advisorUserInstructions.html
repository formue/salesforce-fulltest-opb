<template>
    <div class="aui-root">

        <!-- ── Saving overlay ──────────────────────────────── -->
        <template lwc:if={isSaving}>
            <div class="aui-saving-banner" role="status">
                <span class="wph-phase-dot"></span>
                <span>Saving…</span>
            </div>
        </template>

        <!-- ── EDIT MODE ────────────────────────────────────── -->
        <template lwc:if={isEditing}>
            <div class="aui-edit-block">
                <div class="aui-edit-header">
                    <span class="aui-edit-title">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        {editTitle}
                    </span>
                    <span class="aui-char-count" aria-live="polite">{charCountLabel}</span>
                </div>
                <textarea
                    class="aui-textarea"
                    rows="10"
                    placeholder="Write your personal instructions for the AI…  e.g. &quot;Always write summaries in bullet points. Prefer Norwegian.&quot;"
                    maxlength="32768"
                    value={draftText}
                    oninput={handleDraftInput}></textarea>
                <div class="aui-edit-actions">
                    <button class="aa-footer-btn aa-footer-btn--brand"
                            onclick={handleSave}
                            disabled={isSaveDisabled}>
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        {saveButtonLabel}
                    </button>
                    <button class="aa-footer-btn aa-footer-btn--neutral"
                            onclick={handleCancelEdit}>
                        Cancel
                    </button>
                </div>
            </div>
        </template>

        <!-- ── VIEW MODE ─────────────────────────────────────── -->
        <template lwc:else>

            <!-- Active indicator (shown when the instruction is currently in use) -->
            <template lwc:if={isInUse}>
                <div class="aui-active-banner" role="status">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Instructions are active — they will be prepended to AI context on the next generation.
                </div>
            </template>

            <!-- Has an instruction stored ──────────────────── -->
            <template lwc:if={hasInstruction}>
                <div class="aui-preview-block">
                    <div class="aui-preview-label">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        My AI Instructions
                    </div>
                    <pre class="aui-preview-text">{instructionText}</pre>
                </div>
                <div class="aui-action-row">
                    <template lwc:if={isInUse}>
                        <button class="aui-btn aui-btn--brand aui-btn--active"
                                title="Instructions are in use for this session"
                                disabled>
                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            In Use
                        </button>
                        <button class="aui-btn aui-btn--neutral"
                                onclick={handleEdit}>
                            Edit
                        </button>
                        <button class="aui-btn aui-btn--danger-text"
                                onclick={handleDiscard}
                                title="Stop using these instructions for AI generation">
                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                            Discard
                        </button>
                    </template>
                    <template lwc:else>
                        <button class="aui-btn aui-btn--brand"
                                onclick={handleUse}>
                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none">
                                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                            </svg>
                            Use Instructions
                        </button>
                        <button class="aui-btn aui-btn--neutral"
                                onclick={handleEdit}>
                            Edit
                        </button>
                    </template>
                </div>
            </template>

            <!-- No instruction stored yet ───────────────────── -->
            <template lwc:else>
                <template lwc:if={isLoading}>
                    <div class="aui-empty">Loading…</div>
                </template>
                <template lwc:else>
                    <div class="aui-empty-state">
                        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                        <p class="aui-empty-title">No personal instructions saved yet</p>
                        <p class="aui-empty-sub">Write instructions once and they are always ready to use — tell the AI how you prefer summaries, what language to use, or any standing context about your clients.</p>
                        <button class="aui-btn aui-btn--brand"
                                onclick={handleEdit}>
                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Add Instructions
                        </button>
                    </div>
                </template>
            </template>

        </template>

        <!-- Persistent error banner (non-blocking) -->
        <template lwc:if={errorMessage}>
            <div class="aui-error" role="alert">{errorMessage}</div>
        </template>

    </div>
</template>
